name: Review2 Test Fixture Fix
on:
  push:
    branches: [AgentsPlatform]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: AgentsPlatform
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/mcp/tests/test_agents_review2.py')
          text = p.read_text(encoding='utf-8')
          old = '                "profile.note",\n                poisoned,'
          new = '                "note",\n                poisoned,'
          if old not in text:
              raise SystemExit('test fixture anchor missing')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m compileall -q services/mcp/tests/test_agents_review2.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mcp/tests/test_agents_review2.py
          git commit -m "Review2: make memory trust test retrieve fixture"
          git push origin HEAD:AgentsPlatform
