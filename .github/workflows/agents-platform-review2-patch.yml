name: Agents Platform Review 2 Patcher

on:
  push:
    branches: [AgentsPlatform]

permissions:
  contents: write

jobs:
  patch-review-findings:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: AgentsPlatform
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply review hardening patches
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          old = (
              "        # Ensure tools guidance & persistent user memory are present in system instructions\n"
              "        mem_info = \"\"\n"
              "        try:\n"
              "            from ..memory import get_user_memory_store\n"
              "            mem_summary = get_user_memory_store().get_memory_summary()\n"
              "            if mem_summary and \"Keine gespeicherten\" not in mem_summary:\n"
              "                mem_info = f\"\\n\\n[Persistentes Benutzer-Gedächtnis & Fakten]:\\n{mem_summary}\"\n"
              "        except Exception:\n"
              "            pass\n"
          )
          new = (
              "        # Legacy persistent-memory prompt injection is retained only in\n"
              "        # disabled/shadow mode for backwards compatibility. Active Agents Platform\n"
              "        # injects scoped memory as UNTRUSTED_DATA at user authority in runtime.py.\n"
              "        mem_info = \"\"\n"
              "        if not (\n"
              "            self.config.agents_platform_enabled\n"
              "            and not self.config.agents_platform_shadow_mode\n"
              "        ):\n"
              "            try:\n"
              "                from ..memory import get_user_memory_store\n"
              "                mem_summary = get_user_memory_store().get_memory_summary()\n"
              "                if mem_summary and \"Keine gespeicherten\" not in mem_summary:\n"
              "                    mem_info = f\"\\n\\n[Persistentes Benutzer-Gedächtnis & Fakten]:\\n{mem_summary}\"\n"
              "            except Exception:\n"
              "                pass\n"
          )
          replace_required("services/mcp/agent_loop.py", old, new)

          p = Path("services/mcp/agent_loop.py")
          text = p.read_text(encoding="utf-8")
          start = text.index('                "[Chain-of-Thought Denkphase & Tool-Planung]:\\n"')
          end = text.index('                "[Tool-Calling Format]:\\n"', start)
          replacement = (
              '                "[Tool-Planung]:\\n"\n'
              '                "Plane komplexe Tool-Schritte intern und gib nur knappe, überprüfbare Fortschritts- oder Ergebnisinformationen aus. "\n'
              '                "Gib keine privaten Gedankengänge und keine `<think>`-Blöcke aus.\\n\\n"\n'
          )
          p.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          old = (
              "    def _manifest_from_metadata(self, metadata: dict[str, Any], *, checksum: str, location: str) -> SkillManifest:\n"
              "        status_raw = str(metadata.get(\"status\", \"ACTIVE\")).upper()\n"
          )
          new = (
              "    def _manifest_from_metadata(self, metadata: dict[str, Any], *, checksum: str, location: str) -> SkillManifest:\n"
              "        schema_version = str(metadata.get(\"schema_version\", \"1.0\")).strip()\n"
              "        if schema_version not in {\"1\", \"1.0\"}:\n"
              "            raise ValueError(f\"unsupported skill manifest schema_version: {schema_version}\")\n"
              "        status_raw = str(metadata.get(\"status\", \"ACTIVE\")).upper()\n"
          )
          replace_required("services/mcp/platform/skill_registry.py", old, new)

          old = (
              "    @staticmethod\n"
              "    def _version_key(version: str) -> tuple[Any, ...]:\n"
              "        return tuple(int(part) if part.isdigit() else part.casefold() for part in version.replace(\"-\", \".\").split(\".\"))\n"
          )
          new = (
              "    @staticmethod\n"
              "    def _version_key(version: str) -> tuple[Any, ...]:\n"
              "        parts = version.replace(\"-\", \".\").split(\".\")\n"
              "        return tuple(\n"
              "            (0, int(part)) if part.isdigit() else (1, part.casefold())\n"
              "            for part in parts\n"
              "        )\n"
          )
          replace_required("services/mcp/platform/skill_registry.py", old, new)

          old = (
              "        selected = tuple(names or (\"not_none\", \"no_error_field\"))\n\n"
              "        def validate(value: Any) -> bool:\n"
          )
          new = (
              "        builtins = {\"not_none\", \"non_empty\", \"no_error_field\"}\n"
              "        selected_list: list[str] = []\n"
              "        for raw_name in names:\n"
              "            name = str(raw_name)\n"
              "            if name in builtins:\n"
              "                selected_list.append(name)\n"
              "            elif name.startswith(\"validator:\"):\n"
              "                selected_list.append(name.split(\":\", 1)[1])\n"
              "        selected = tuple(selected_list or (\"not_none\", \"no_error_field\"))\n\n"
              "        def validate(value: Any) -> bool:\n"
          )
          replace_required("services/mcp/platform/pipeline.py", old, new)

          old = (
              "    def _policy_allowed_skills(\n"
              "        policy: RuntimePolicyEnvelope | None,\n"
              "    ) -> tuple[str, ...] | None:\n"
              "        if policy is None or not policy.allowed_skills:\n"
              "            return None\n"
              "        return policy.allowed_skills\n"
          )
          new = (
              "    def _policy_allowed_skills(\n"
              "        policy: RuntimePolicyEnvelope | None,\n"
              "    ) -> tuple[str, ...] | None:\n"
              "        if policy is None:\n"
              "            return None\n"
              "        return policy.allowed_skills\n"
          )
          replace_required("services/mcp/platform/runtime.py", old, new)

          old = (
              "    def _policy_allowed_tools(\n"
              "        policy: RuntimePolicyEnvelope | None,\n"
              "    ) -> tuple[str, ...] | None:\n"
              "        if policy is None or not policy.allowed_tools:\n"
              "            return None\n"
              "        return policy.allowed_tools\n"
          )
          new = (
              "    def _policy_allowed_tools(\n"
              "        policy: RuntimePolicyEnvelope | None,\n"
              "    ) -> tuple[str, ...] | None:\n"
              "        if policy is None:\n"
              "            return None\n"
              "        return policy.allowed_tools\n"
          )
          replace_required("services/mcp/platform/runtime.py", old, new)

          old = (
              "        if runtime_policy is not None and runtime_policy.allowed_tools:\n"
              "            all_names = {\n"
              "                tool.name\n"
              "                for tool in self.tool_registry.list_tools(is_owner=is_owner)\n"
              "            }\n"
              "            policy_disabled |= all_names - set(runtime_policy.allowed_tools)\n"
          )
          new = (
              "        if runtime_policy is not None:\n"
              "            all_names = {\n"
              "                tool.name\n"
              "                for tool in self.tool_registry.list_tools(is_owner=is_owner)\n"
              "            }\n"
              "            policy_disabled |= all_names - set(runtime_policy.allowed_tools)\n"
          )
          replace_required("services/mcp/platform/runtime.py", old, new)

          replace_required(
              "services/mcp/tests/test_agents_platform.py",
              '        self.assertEqual(store.delete(user_a.memory_id, cascade_derived=True), 2)\n',
              '        self.assertEqual(store.delete(user_a.memory_id, scope=MemoryScope.USER, scope_id="A", cascade_derived=True), 2)\n',
          )

          p = Path("services/mcp/platform/__init__.py")
          text = p.read_text(encoding="utf-8")
          text = text.replace(
              "    RequestEnvelope,\n",
              "    RequestEnvelope,\n    RuntimePolicyEnvelope,\n",
          ).replace(
              "    ToolExecutionContext,\n",
              "    ToolAuthorizationGrant,\n    ToolExecutionContext,\n",
          ).replace(
              "from .runtime import AgentsPlatformRuntime, PlatformPreparation, build_agents_platform_runtime\n",
              "from .runtime import AgentsPlatformRuntime, PlatformContextBlock, PlatformPreparation, build_agents_platform_runtime\n",
          )
          for symbol, anchor in (
              ('    "RuntimePolicyEnvelope",\n', '    "RuleResolution",\n'),
              ('    "ToolAuthorizationGrant",\n', '    "ToolCapabilityRegistry",\n'),
              ('    "PlatformContextBlock",\n', '    "PlatformError",\n'),
          ):
              if symbol not in text:
                  text = text.replace(anchor, anchor + symbol, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Validate patch syntax
        run: |
          python -m compileall -q services/mcp/platform services/memory services/mcp/agent_loop.py
          git diff --check

      - name: Commit review hardening
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mcp/agent_loop.py services/mcp/platform services/mcp/tests/test_agents_platform.py
          git commit -m "AgentsPlatform review2: complete security hardening patches"
          git push origin HEAD:AgentsPlatform
