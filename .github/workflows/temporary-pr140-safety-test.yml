name: Temporary PR140 Security Unit Tests

on:
  push:
    branches:
      - jules-9136794293772510248-f6a6c14b-new

permissions:
  contents: read

jobs:
  architecture-part14:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout exact PR code without persisted token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Verify checked out source SHA
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Python environment
        run: python3 --version
      - name: Compile targeted source and tests
        run: python3 -m py_compile services/orchestrator/architecture_hardening_part14.py services/orchestrator/tests/test_architecture_hardening_part14.py
      - name: Run real SQLite-backed architecture hardening tests
        run: python3 -m unittest services.orchestrator.tests.test_architecture_hardening_part14 -v

  full-python-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    env:
      COMPUTEMESH_INFERENCE_BACKEND: synthetic
      COMPUTEMESH_ALLOW_SYNTHETIC_INFERENCE: "1"
      COMPUTEMESH_ALLOW_STATIC_MODEL_CATALOG: "1"
    steps:
      - name: Checkout source SHA, no persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Verify checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install declared test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt
      - name: Compile repository Python source
        run: python3 -m compileall -q apps deploy models protocol runtime sdk services setup tests tools
      - name: Full ComputeMesh Python regression (fail closed)
        run: python3 run_all_tests.py
