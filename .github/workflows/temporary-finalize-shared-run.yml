name: Temporary finalize shared-run evidence block

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.ref == 'm1/shared-run-evidence' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/shared-run-evidence
          fetch-depth: 0
      - name: Update canonical state and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('state.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one state.md anchor, found {text.count(old)}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '**Phase:** M0 foundation with M1 reference identity, controlled llama.cpp runtime/relay tooling, artifact-derived GGUF manifests, bounded two-machine Lab evidence transfer, fail-closed two-node evidence bundling, and deterministic two-node feasibility planning; real shared inference is not yet evidenced  ',
              '**Phase:** M0 foundation with M1 reference identity, controlled llama.cpp runtime/relay tooling, artifact-derived GGUF manifests, bounded two-machine Lab evidence transfer, fail-closed two-node evidence bundling, deterministic two-node feasibility planning, and fail-closed shared-run proof binding; real shared inference is not yet evidenced  ',
          )

          replace_once(
              '- bounded two-machine Lab evidence export/import + bundle launchers are implemented in PR #10; final cross-platform code/test/docs validation run `32553817653` passed before this final state bookkeeping\n',
              '- bounded two-machine Lab evidence export/import + bundle launchers landed through PR #10; final cross-platform validation run `32553817653` passed\n- fail-closed M1 shared-run proof binding is implemented in PR #11; cross-platform validation run `32554426093` passed on the code/test state before documentation-only finalization\n',
          )

          runtime_anchor = '**Boundary:** no actual successful shared local+RPC two-machine inference artifact has yet been recorded. ADR 0002 remains Proposed.\n\n### M1 TCP measurement relay\n'
          runtime_insert = '''**Boundary:** no actual successful shared local+RPC two-machine inference artifact has yet been recorded. ADR 0002 remains Proposed.\n\n### Fail-closed M1 shared-run proof binding\n\n`runtime/llama/shared_run_evidence.py` binds one already-created current experiment bundle, local baseline, relayed shared RPC result, and relay metrics into a single content-addressed engineering proof. It does not execute the experiment.\n\nThe builder validates all four source contracts plus the embedded placement decision, then fails closed unless the evidence is one coherent first shared-runtime proof:\n\n- exact bundle model basename, size and SHA-256 on baseline and shared runs;\n- identical bounded llama.cpp runtime version and prompt digest;\n- one local baseline device, then the same coordinator device followed by one RPC device in the shared run;\n- exact planner-selected two-entry `tensor_split` in coordinator/worker order;\n- shared RPC topology routed through exactly the recorded loopback measurement-relay endpoint;\n- relay target restricted to literal loopback/RFC1918 IPv4;\n- first proof unperturbed by configured relay delay/jitter or forced disconnect;\n- successful relay connection ending by EOF with positive traffic in both directions and consistent byte totals;\n- bounded chronology from bundle to baseline to relay/shared result;\n- exact token-ID digest match when both runs expose token IDs, otherwise exact output digest match.\n\nInputs are bounded, symlink-free, strict finite UTF-8 JSON. The output stores source basenames/SHA-256, run/bundle/decision IDs, model/runtime identity, planner split/ranges, correctness digests, performance ratios, relay timing and opaque directional bytes. It stores no raw prompt/output and refuses overwrite. `production_scheduling` is always `false`.\n\n**Boundary:** source hashes prove integrity/binding, not producer identity. The builder does not authenticate the upstream RPC worker, prove the relay target's physical identity, identify activation tensors, or authorize production scheduling.\n\n### M1 TCP measurement relay\n'''
          replace_once(runtime_anchor, runtime_insert)

          validation_anchor = 'This is software/loopback/synthetic-evidence validation. It is **not** real two-machine shared-runtime or placement-performance evidence.\n\n## Real target-machine evidence from 2026-08-21\n'
          validation_insert = '''This is software/loopback/synthetic-evidence validation. It is **not** real two-machine shared-runtime or placement-performance evidence.\n\n## Cross-platform validation for the shared-run evidence block\n\nPR #11 code/test state was validated by GitHub Actions run **`32554426093`** on both Windows Server 2025 / Python 3.11.9 and Ubuntu 24.04 / Python 3.11. The matrix passed all eight suites on both platforms:\n\n- benchmark/model tooling: **32/32**;\n- orchestrator: **34/34**;\n- protocol: **66/66**;\n- identity/integration: **13/13**;\n- scheduler placement + evidence bundle: **36/36**;\n- llama runtime + shared-run proof binding: **25/25**;\n- network runtime relay: **10/10**;\n- setup/launcher/evidence transfer: **33/33**.\n\nThe 13 new shared-run proof tests cover the valid bound proof, recommendation/model/runtime mismatches, planner split and device-order binding, relay bypass/public-target rejection, unperturbed-first-proof constraints, bidirectional byte consistency, exact correctness, output-digest fallback, chronology, non-finite JSON, overwrite refusal and symlink rejection.\n\nThis validation is still synthetic/software evidence. It does not substitute for the physical two-machine run. Documentation-only state/README updates and temporary-workflow removal follow the successful code/test run.\n\n## Real target-machine evidence from 2026-08-21\n'''
          replace_once(validation_anchor, validation_insert)

          replace_once(
              '- real llama.cpp-through-relay byte/timing evidence on the target machines;\n',
              '- real llama.cpp-through-relay byte/timing evidence on the target machines;\n- a real `shared_run_evidence.json` bound from the exact successful physical bundle/baseline/shared/relay artifacts;\n',
          )

          old_steps = '''12. Run `compare`; require same model/prompt digests and exact token/output correctness before making a shared-inference claim.\n13. Retain relay directional byte totals plus setup/active timing for that exact successful run.\n14. Repeat controlled delay/jitter/disconnect experiments; use separate controlled OS/network emulation if packet loss/reordering becomes material.\n15. Accept, reject or supersede ADR 0002 from measured evidence, then calibrate scheduler ranking from the correct shared result instead of invented coefficients.\n16. Bind only the minimum artifact/runtime/result/failure messages required by the winning path and continue toward reproducible correct two-node inference under ComputeMesh control.\n'''
          new_steps = '''12. Run `compare`; require same model/prompt digests and exact token/output correctness before making a shared-inference claim.\n13. Retain relay directional byte totals plus setup/active timing for that exact successful run.\n14. Build `shared_run_evidence.json` from the exact current bundle, baseline, shared result and relay metrics; do not mix historical or differently ordered/device-mapped artifacts.\n15. Repeat controlled delay/jitter/disconnect experiments separately from the unperturbed first proof; use controlled OS/network emulation if packet loss/reordering becomes material.\n16. Accept, reject or supersede ADR 0002 from measured evidence, then calibrate scheduler ranking from the correct shared result instead of invented coefficients.\n17. Bind only the minimum artifact/runtime/result/failure messages required by the winning path and continue toward reproducible correct two-node inference under ComputeMesh control.\n'''
          replace_once(old_steps, new_steps)

          path.write_text(text, encoding='utf-8')
          PY
          rm -f .github/workflows/shared-run-evidence-validation.yml
          rm -f .github/workflows/temporary-finalize-shared-run.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.md .github/workflows
          git commit -m 'docs: finalize shared-run evidence state'
          git push origin HEAD:m1/shared-run-evidence
