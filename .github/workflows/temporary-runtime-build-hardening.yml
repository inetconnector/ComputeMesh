              'dieselbe vollständige GGUF + frische Profile/llama-bench aus einem passenden llama.cpp-Build auf beiden Nodes',
          )

          # Canonical state.
          replace_once(
              'state.md',
              '**Phase:** M0 foundation with M1 reference identity, controlled llama.cpp runtime/relay tooling, artifact-derived GGUF manifests, bounded two-machine Lab evidence transfer, fail-closed two-node evidence bundling, deterministic two-node feasibility planning, fail-closed shared-run proof binding, and one-command physical shared-trial orchestration; real shared inference is not yet evidenced  ',
              '**Phase:** M0 foundation with M1 reference identity, controlled llama.cpp runtime/relay tooling, artifact-derived GGUF manifests, bounded two-machine Lab evidence transfer, fail-closed two-node evidence bundling, deterministic two-node feasibility planning, fail-closed shared-run proof binding, one-command physical shared-trial orchestration, and llama.cpp benchmark→runtime build binding; real shared inference is not yet evidenced  ',
          )
          replace_once(
              'state.md',
              '- one-command physical shared-trial orchestration is implemented in PR #12; final cross-platform validation run `32558221241` passed before final state bookkeeping/workflow removal\n',
              '- one-command physical shared-trial orchestration landed through PR #12; final cross-platform validation run `32558221241` passed\n- llama.cpp benchmark→runtime build binding is implemented on the current PR branch; final cross-platform validation is pending before merge\n',
          )
          replace_once(
              'state.md',
              'Before model loading it revalidates the current experiment bundle and embedded placement schema, recalculates whether the recorded profiles are still within `PlannerPolicy.max_profile_age_hours`, requires exact local GGUF basename/size/SHA-256, rejects a symlinked/non-file `llama-server`, discovers the current local device, and preflights the private RPC worker.',
              'Before model loading it revalidates the current experiment bundle and embedded placement schema, recalculates whether the recorded profiles are still within `PlannerPolicy.max_profile_age_hours`, requires exact local GGUF basename/size/SHA-256, requires a current `runtime_build` derived from one identical concrete llama.cpp build number/commit across all four selected two-node llama-bench records, rejects a symlinked/non-file `llama-server`, verifies `llama-server --version` against that build binding, discovers the current local device, and preflights the private RPC worker.',
