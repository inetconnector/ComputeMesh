name: Temporary runtime build launcher and docs hardening

on:
  push:
    branches: [m1/runtime-build-binding]
    paths:
      - .github/workflows/temporary-runtime-build-hardening.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/runtime-build-binding
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Apply launcher, compatibility, documentation hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:140]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Keep schema-v1 old artifacts parseable; current runtime/proof paths explicitly require the new field.
          replace_once(
              'services/scheduler/experiment_bundle.schema.json',
              '    "benchmark_model_name",\n    "runtime_build",\n    "sources",',
              '    "benchmark_model_name",\n    "sources",',
          )
          replace_once(
              'runtime/llama/shared_trial.py',
              '    runtime_build = bundle["runtime_build"]\n    return TrialPlan(',
              '    runtime_build = bundle.get("runtime_build")\n    if not isinstance(runtime_build, dict):\n        raise SharedTrialError(\n            "experiment bundle lacks current llama.cpp runtime_build binding; rebuild it from fresh two-node llama-bench evidence"\n        )\n    return TrialPlan(',
          )
          replace_once(
              'runtime/llama/shared_run_evidence.py',
              '    expected_build = bundle["runtime_build"]\n    try:',
              '    expected_build = bundle.get("runtime_build")\n    if not isinstance(expected_build, dict):\n        raise SharedRunEvidenceError(\n            "experiment bundle lacks current llama.cpp runtime_build binding; rebuild current evidence"\n        )\n    try:',
          )

          # Windows worker: when a remembered benchmark exists, do not fall through to another build tree/PATH.
          replace_once(
              'setup/shared-worker.ps1',
              '''    if ($Preferred -and (Test-Path $Preferred)) {\n        $dir = Split-Path -Parent $Preferred\n        foreach ($name in $names) {\n            $direct = Join-Path $dir $name\n            if (Test-Path $direct -PathType Leaf) { return $direct }\n        }\n        foreach ($name in $names) {\n            $found = Get-ChildItem -Path $dir -Filter $name -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1\n            if ($found) { return $found.FullName }\n        }\n    }\n    $runtime = Join-Path $RepoRoot 'artifacts\\lab\\runtime\\llama.cpp'\n''',
              '''    if ($Preferred -and (Test-Path $Preferred -PathType Leaf)) {\n        $dir = Split-Path -Parent $Preferred\n        foreach ($name in $names) {\n            $direct = Join-Path $dir $name\n            if (Test-Path $direct -PathType Leaf) { return $direct }\n        }\n        foreach ($name in $names) {\n            $found = Get-ChildItem -Path $dir -Filter $name -File -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1\n            if ($found) { return $found.FullName }\n        }\n        return $null\n    }\n    $runtime = Join-Path $RepoRoot 'artifacts\\lab\\runtime\\llama.cpp'\n''',
          )
          replace_once(
              'setup/shared-worker.ps1',
              '''    $bench = Find-Llama\n    $rpc = Find-RpcServer $bench\n    if (-not $rpc) { $rpc = Select-LocalFile 'RPC server (*.exe)|rpc-server.exe;ggml-rpc-server.exe|Executables (*.exe)|*.exe' 'Choose rpc-server.exe / ggml-rpc-server.exe' }\n    if (-not $rpc -or -not (Test-Path $rpc -PathType Leaf)) { throw 'RPC server executable not selected.' }\n''',
              '''    $bench = Find-Llama\n    $rpc = Find-RpcServer $bench\n    if ($bench -and (Test-Path $bench -PathType Leaf) -and -not $rpc) {\n        throw 'No rpc-server was found in the same llama.cpp build tree as the remembered llama-bench. Install/use a complete matching build and rerun llama-bench; cross-build fallback is disabled for the shared proof.'\n    }\n    if (-not $rpc) { $rpc = Select-LocalFile 'RPC server (*.exe)|rpc-server.exe;ggml-rpc-server.exe|Executables (*.exe)|*.exe' 'Choose rpc-server.exe / ggml-rpc-server.exe' }\n    if (-not $rpc -or -not (Test-Path $rpc -PathType Leaf)) { throw 'RPC server executable not selected.' }\n''',
          )

          # Linux worker: same rule as Windows.
          replace_once(
              'setup/SHARED-WORKER.sh',
              '''py="$(ensure_python)"\n\nfind_rpc_server() {\n  local status saved runtime found\n  status="$(invoke_lab status | tail -n1)"\n  saved="$(json_field "$status" llama_bench)"\n  if [[ -n "$saved" && -e "$saved" ]]; then\n    for name in rpc-server ggml-rpc-server; do\n      found="$(find "$(dirname "$saved")" -type f -name "$name" -print -quit 2>/dev/null || true)"\n      [[ -n "$found" ]] && { printf '%s\\n' "$found"; return 0; }\n    done\n  fi\n  runtime="$REPO_ROOT/artifacts/lab/runtime/llama.cpp"\n''',
              '''py="$(ensure_python)"\nstatus="$(invoke_lab status | tail -n1)"\nsaved_bench="$(json_field "$status" llama_bench)"\n\nfind_rpc_server() {\n  local runtime found\n  if [[ -n "$saved_bench" && -f "$saved_bench" ]]; then\n    for name in rpc-server ggml-rpc-server; do\n      found="$(find "$(dirname "$saved_bench")" -type f -name "$name" -print -quit 2>/dev/null || true)"\n      [[ -n "$found" ]] && { printf '%s\\n' "$found"; return 0; }\n    done\n    return 0\n  fi\n  runtime="$REPO_ROOT/artifacts/lab/runtime/llama.cpp"\n''',
          )
          replace_once(
              'setup/SHARED-WORKER.sh',
              '''rpc="$(find_rpc_server)"\nif [[ -z "$rpc" ]]; then\n  read -r -e -p 'rpc-server / ggml-rpc-server path: ' rpc\n  rpc="${rpc%\\\"}"; rpc="${rpc#\\\"}"\nfi\n''',
              '''rpc="$(find_rpc_server)"\nif [[ -n "$saved_bench" && -f "$saved_bench" && -z "$rpc" ]]; then\n  echo 'No rpc-server was found in the same llama.cpp build tree as the remembered llama-bench. Install/use a complete matching build and rerun llama-bench; cross-build fallback is disabled for the shared proof.' >&2\n  exit 1\nfi\nif [[ -z "$rpc" ]]; then\n  read -r -e -p 'rpc-server / ggml-rpc-server path: ' rpc\n  rpc="${rpc%\\\"}"; rpc="${rpc#\\\"}"\nfi\n''',
          )

          # Static launcher regressions.
          replace_once(
              'setup/tests/test_scripts.py',
              "        self.assertIn('$uacArgs', worker)\n        self.assertNotIn('$args =', worker)",
              "        self.assertIn('$uacArgs', worker)\n        self.assertIn('cross-build fallback is disabled for the shared proof', worker)\n        self.assertIn('return $null', worker)\n        self.assertNotIn('$args =', worker)",
          )
          replace_once(
              'setup/tests/test_linux_setup.py',
              "        self.assertIn('trap cleanup_rpc_firewall EXIT INT TERM', text)\n        self.assertIn('-m runtime.llama.rpc_spike worker', text)",
              "        self.assertIn('trap cleanup_rpc_firewall EXIT INT TERM', text)\n        self.assertIn('saved_bench=', text)\n        self.assertIn('cross-build fallback is disabled for the shared proof', text)\n        self.assertIn('-m runtime.llama.rpc_spike worker', text)",
          )

          # Scheduler documentation.
          replace_once(
              'services/scheduler/README.md',
              '11. rejects any resulting `caller_asserted_v1` network binding;\n12. emits one schema-valid bundle containing the placement decision and source provenance.',
              '11. rejects any resulting `caller_asserted_v1` network binding;\n12. requires all four selected llama-bench records to carry the same concrete `llama_build_commit` and positive `llama_build_number`;\n13. emits one schema-valid bundle containing the placement decision, the derived `runtime_build` binding, and source provenance.',
          )
          replace_once(
              'services/scheduler/README.md',
              'Provenance records contain only safe source basenames plus SHA-256 of the exact JSON documents, run IDs/node revisions and model artifact identity. Absolute local paths are never included. `bundle_id` is deterministic for the same source documents and placement decision.',
              'Provenance records contain only safe source basenames plus SHA-256 of the exact JSON documents, run IDs/node revisions and model artifact identity. The bundle also exposes the common selected llama.cpp build number/commit as `runtime_build`, derived from those already hash-bound benchmark documents. Absolute local paths are never included. `bundle_id` is deterministic for the same source documents and placement decision.',
          )
          replace_once(
              'services/scheduler/README.md',
              'Bundle coverage additionally includes highest-profile selection, multi-node-root rejection/disambiguation, wrong/legacy network direction rejection, pre-profile benchmark rejection, exact artifact-size filtering, common-model selection, ambiguous latest-run rejection, corrupt evidence fail-closed behavior, deterministic provenance identity, schema validation, absolute-path non-disclosure, and rejection of caller-asserted peer binding from the current bundle path.',
              'Bundle coverage additionally includes highest-profile selection, multi-node-root rejection/disambiguation, wrong/legacy network direction rejection, pre-profile benchmark rejection, exact artifact-size filtering, common-model selection, ambiguous latest-run rejection, corrupt evidence fail-closed behavior, deterministic provenance identity, schema validation, absolute-path non-disclosure, caller-asserted peer rejection, and exact two-node llama.cpp build-identity binding.',
          )

          # Runtime documentation.
          replace_once(
              'runtime/llama/README.md',
              'Before loading the model, `shared_trial.py` revalidates the bundle, current planner freshness, exact GGUF basename/size/SHA-256, local device selection, and current `llama-server` RPC visibility.',
              'Before loading the model, `shared_trial.py` revalidates the bundle, current planner freshness, exact GGUF basename/size/SHA-256, the llama.cpp build number/commit already bound from both nodes\' selected llama-bench records, local device selection, and current `llama-server` RPC visibility. The current `llama-server --version` build must match that bundle binding before device discovery or model loading.',
          )
          replace_once(
              'runtime/llama/README.md',
              '- both runs must use the same bounded llama.cpp version string and prompt digest;',
              '- both runs must use the same bounded llama.cpp version string and prompt digest, and that runtime version must parse to the same build number/commit bound by the bundle\'s selected two-node llama-bench evidence;',
          )
          replace_once(
              'runtime/llama/README.md',
              'The llama runtime suite covers private endpoint restrictions, worker/coordinator command safety, explicit shared placement, local baseline, no-cache deterministic request settings, bounded response parsing, model hashing, failure-record privacy, baseline/shared comparison, result schemas, planner split/device-order binding, proof chronology, relay-path binding, relay byte consistency, unperturbed-first-proof constraints, non-finite input rejection, device-list parsing/selection, stale-bundle rechecks, exact model binding, RPC server-vs-CLI preflight diagnosis, CPU-coordinator fail-closed behavior, exact split propagation, and output privacy.',
              'The llama runtime suite covers private endpoint restrictions, worker/coordinator command safety, explicit shared placement, local baseline, no-cache deterministic request settings, bounded response parsing, model hashing, failure-record privacy, baseline/shared comparison, result schemas, planner split/device-order binding, proof chronology, relay-path binding, relay byte consistency, unperturbed-first-proof constraints, non-finite input rejection, device-list parsing/selection, stale-bundle rechecks, exact model binding, llama.cpp build-number/commit parsing and benchmark→server→proof binding, RPC server-vs-CLI preflight diagnosis, CPU-coordinator fail-closed behavior, exact split propagation, and output privacy.',
          )

          # Setup English/German docs.
          replace_once(
              'setup/README.md',
              'The worker launcher binds llama.cpp RPC to one concrete RFC1918 address on TCP 50052. Where supported it opens only a temporary private-LAN/subnet-scoped firewall rule and removes that rule when the worker exits. Keep the worker window/terminal open.',
              'The worker launcher binds llama.cpp RPC to one concrete RFC1918 address on TCP 50052. If Lab Setup remembers a `llama-bench`, the worker launcher will use `rpc-server` only from that same local llama.cpp build tree; it will not silently fall through to another downloaded build or `$PATH`. If the matching RPC binary is missing, install/use a complete matching build and rerun the benchmark. Where supported it opens only a temporary private-LAN/subnet-scoped firewall rule and removes that rule when the worker exits. Keep the worker window/terminal open.',
          )
          replace_once(
              'setup/README.md',
              '3. require the exact local GGUF basename, byte size, and SHA-256 from the bundle;\n4. discover the current local llama.cpp device and preflight RPC visibility before loading the model;',
              '3. require the exact local GGUF basename, byte size, and SHA-256 from the bundle;\n4. require `llama-server --version` to match the common llama.cpp build number/commit recorded by all four selected two-node llama-bench records in the bundle;\n5. discover the current local llama.cpp device and preflight RPC visibility before loading the model;',
          )
          # Renumber remaining English list items 5..9 after insertion.
          p = Path('setup/README.md'); t = p.read_text(encoding='utf-8')
          old = '''5. if `llama-cli` can see the RPC device but `llama-server` cannot, report that server/RPC compatibility condition explicitly instead of attempting the measured run;\n6. run the deterministic local baseline;\n7. start a fresh zero-delay loopback measurement relay and execute exactly the planner-selected two-entry split through it;\n8. require exact token-ID correctness when available, otherwise exact output-digest correctness;\n9. write `comparison.json`, relay metrics, and the already defined fail-closed `shared_run_evidence.json`.'''
          new = '''6. if `llama-cli` can see the RPC device but `llama-server` cannot, report that server/RPC compatibility condition explicitly instead of attempting the measured run;\n7. run the deterministic local baseline;\n8. start a fresh zero-delay loopback measurement relay and execute exactly the planner-selected two-entry split through it;\n9. require exact token-ID correctness when available, otherwise exact output-digest correctness;\n10. write `comparison.json`, relay metrics, and the already defined fail-closed `shared_run_evidence.json`.'''
          if t.count(old) != 1: raise SystemExit('setup/README.md numbering anchor missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'setup/README.de.md',
              'Der Worker-Starter bindet llama.cpp-RPC an genau eine RFC1918-Adresse auf TCP 50052. Wo unterstützt, wird nur eine temporäre auf privates LAN/Subnetz begrenzte Firewallregel geöffnet und beim Ende des Workers wieder entfernt. Das Worker-Fenster/Terminal offen lassen.',
              'Der Worker-Starter bindet llama.cpp-RPC an genau eine RFC1918-Adresse auf TCP 50052. Ist im Lab Setup ein `llama-bench` gespeichert, verwendet der Worker-Starter `rpc-server` nur aus demselben lokalen llama.cpp-Build-Baum; er fällt nicht still auf einen anderen Download oder `$PATH` zurück. Fehlt dort die passende RPC-Binary, muss ein vollständiger passender Build verwendet und der Benchmark neu ausgeführt werden. Wo unterstützt, wird nur eine temporäre auf privates LAN/Subnetz begrenzte Firewallregel geöffnet und beim Ende des Workers wieder entfernt. Das Worker-Fenster/Terminal offen lassen.',
          )
          replace_once(
              'setup/README.de.md',
              '3. exakt den GGUF-Basename, die Bytegröße und den SHA-256 aus dem Bundle verlangen;\n4. das aktuelle lokale llama.cpp-Gerät ermitteln und die RPC-Sichtbarkeit vor dem Modellladen prüfen;',
              '3. exakt den GGUF-Basename, die Bytegröße und den SHA-256 aus dem Bundle verlangen;\n4. verlangen, dass `llama-server --version` zu der gemeinsamen llama.cpp-Buildnummer/dem Commit passt, die alle vier ausgewählten Zwei-Node-llama-bench-Datensätze im Bundle tragen;\n5. das aktuelle lokale llama.cpp-Gerät ermitteln und die RPC-Sichtbarkeit vor dem Modellladen prüfen;',
          )
          p = Path('setup/README.de.md'); t = p.read_text(encoding='utf-8')
          old = '''5. falls `llama-cli` den RPC-Worker sieht, `llama-server` aber nicht, diesen Server/RPC-Kompatibilitätsfall ausdrücklich melden statt den Messlauf zu starten;\n6. die deterministische lokale Baseline ausführen;\n7. ein frisches Zero-Delay-Loopback-Mess-Relay starten und exakt den vom Planer gewählten Zwei-Einträge-Split darüber ausführen;\n8. exakte Token-ID-Korrektheit verlangen, sofern vorhanden, sonst exakten Output-Digest;\n9. `comparison.json`, Relay-Metriken und das bereits definierte fail-closed `shared_run_evidence.json` schreiben.'''
          new = '''6. falls `llama-cli` den RPC-Worker sieht, `llama-server` aber nicht, diesen Server/RPC-Kompatibilitätsfall ausdrücklich melden statt den Messlauf zu starten;\n7. die deterministische lokale Baseline ausführen;\n8. ein frisches Zero-Delay-Loopback-Mess-Relay starten und exakt den vom Planer gewählten Zwei-Einträge-Split darüber ausführen;\n9. exakte Token-ID-Korrektheit verlangen, sofern vorhanden, sonst exakten Output-Digest;\n10. `comparison.json`, Relay-Metriken und das bereits definierte fail-closed `shared_run_evidence.json` schreiben.'''
          if t.count(old) != 1: raise SystemExit('setup/README.de.md numbering anchor missing')
          p.write_text(t.replace(old, new, 1), encoding='utf-8')

          # Root bilingual entry points.
          replace_once(
              'README.md',
              'For the current real M1 experiment, `services/scheduler/evidence_bundle.py` is deliberately stricter. Given two Lab evidence roots plus the model manifest, it selects the highest coherent profile revision, exact-size prefill/decode runs for one common model basename, and a correctly directed network record with embedded local/peer IDs. It does **not** allow caller-asserted peer or layer fallbacks.',
              'For the current real M1 experiment, `services/scheduler/evidence_bundle.py` is deliberately stricter. Given two Lab evidence roots plus the model manifest, it selects the highest coherent profile revision, exact-size prefill/decode runs for one common model basename, requires all four selected llama-bench records across both nodes to carry one identical concrete llama.cpp build number/commit, and selects a correctly directed network record with embedded local/peer IDs. It does **not** allow caller-asserted peer or layer fallbacks.',
          )
          replace_once(
              'README.md',
              '`runtime/llama/rpc_spike.py` can discover current llama.cpp devices, record a deterministic local baseline, run an explicit local+RPC `layer` split, and compare the exact same model/prompt by token-ID digest when available (otherwise output digest). It records model/runtime/topology/timing evidence without raw prompt/output persistence. `runtime/llama/shared_trial.py` now composes that narrow first-proof flow into one fail-closed coordinator command: it rechecks bundle freshness and exact GGUF identity, preflights current RPC visibility, runs baseline and the planner-selected split through a fresh measurement relay, requires exact correctness, and builds `shared_run_evidence.json`.',
              '`runtime/llama/rpc_spike.py` can discover current llama.cpp devices, record a deterministic local baseline, run an explicit local+RPC `layer` split, and compare the exact same model/prompt by token-ID digest when available (otherwise output digest). It records model/runtime/topology/timing evidence without raw prompt/output persistence. `runtime/llama/shared_trial.py` now composes that narrow first-proof flow into one fail-closed coordinator command: it rechecks bundle freshness and exact GGUF identity, requires the current `llama-server` build number/commit to match the build bound from both nodes\' selected llama-bench evidence, preflights current RPC visibility, runs baseline and the planner-selected split through a fresh measurement relay, requires exact correctness, and builds `shared_run_evidence.json`.',
          )
          replace_once(
              'README.md',
              'same complete GGUF + fresh profiles/llama-bench on both nodes',
              'same complete GGUF + fresh profiles/llama-bench from one matching llama.cpp build on both nodes',
          )

          replace_once(
              'README.de.md',
              'Für das aktuelle reale M1-Experiment ist `services/scheduler/evidence_bundle.py` bewusst strenger. Aus zwei Lab-Evidenzwurzeln plus Modellmanifest wählt es die höchste konsistente Profilrevision, Prefill-/Decode-Läufe mit exakt passender Manifest-Artefaktgröße für einen gemeinsamen Modell-Basename und einen korrekt gerichteten Netzwerkdatensatz mit eingebetteter Local-/Peer-ID. **Caller-asserted Peer- oder Layer-Fallbacks sind dort nicht zulässig.**',
              'Für das aktuelle reale M1-Experiment ist `services/scheduler/evidence_bundle.py` bewusst strenger. Aus zwei Lab-Evidenzwurzeln plus Modellmanifest wählt es die höchste konsistente Profilrevision, Prefill-/Decode-Läufe mit exakt passender Manifest-Artefaktgröße für einen gemeinsamen Modell-Basename, verlangt für alle vier ausgewählten llama-bench-Datensätze beider Nodes dieselbe konkrete llama.cpp-Buildnummer/denselben Commit und wählt einen korrekt gerichteten Netzwerkdatensatz mit eingebetteter Local-/Peer-ID. **Caller-asserted Peer- oder Layer-Fallbacks sind dort nicht zulässig.**',
          )
          replace_once(
              'README.de.md',
              '`runtime/llama/rpc_spike.py` kann aktuelle llama.cpp-Geräte ermitteln, eine deterministische lokale Baseline aufzeichnen, einen expliziten Local+RPC-`layer`-Split ausführen und exakt dasselbe Modell/denselben Prompt per Token-ID-Digest vergleichen, sofern vorhanden, sonst per Output-Digest. Modell-/Runtime-/Topologie-/Timing-Evidenz wird ohne Rohprompt-/Rohoutput-Persistenz gespeichert. `runtime/llama/shared_trial.py` fasst diesen engen First-Proof-Pfad jetzt in einem fail-closed Coordinator-Befehl zusammen: Bundle-Frische und exakte GGUF-Identität werden erneut geprüft, aktuelle RPC-Sichtbarkeit wird vorab getestet, Baseline und Planer-Split laufen über ein frisches Mess-Relay, exakte Korrektheit wird verlangt und anschließend `shared_run_evidence.json` gebaut.',
              '`runtime/llama/rpc_spike.py` kann aktuelle llama.cpp-Geräte ermitteln, eine deterministische lokale Baseline aufzeichnen, einen expliziten Local+RPC-`layer`-Split ausführen und exakt dasselbe Modell/denselben Prompt per Token-ID-Digest vergleichen, sofern vorhanden, sonst per Output-Digest. Modell-/Runtime-/Topologie-/Timing-Evidenz wird ohne Rohprompt-/Rohoutput-Persistenz gespeichert. `runtime/llama/shared_trial.py` fasst diesen engen First-Proof-Pfad jetzt in einem fail-closed Coordinator-Befehl zusammen: Bundle-Frische und exakte GGUF-Identität werden erneut geprüft, die aktuelle `llama-server`-Buildnummer/der Commit muss zu der aus beiden Nodes ausgewählten llama-bench-Evidenz gebundenen Build-Identität passen, aktuelle RPC-Sichtbarkeit wird vorab getestet, Baseline und Planer-Split laufen über ein frisches Mess-Relay, exakte Korrektheit wird verlangt und anschließend `shared_run_evidence.json` gebaut.',
