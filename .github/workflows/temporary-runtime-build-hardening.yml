          replace_once(
              'state.md',
              '3. Run fresh llama-bench prefill/decode on both machines for that exact same GGUF and exact size.',
              '3. Run fresh llama-bench prefill/decode on both machines for that exact same GGUF and exact size, using llama.cpp builds with the same concrete build number/commit on both nodes; the current bundle rejects cross-build benchmark evidence.',
          )
          replace_once(
              'state.md',
              '9. On worker B, start `setup\\SHARED-WORKER.cmd` or `bash setup/SHARED-WORKER.sh` on the trusted private LAN and keep it running.',
              '9. On worker B, start `setup\\SHARED-WORKER.cmd` or `bash setup/SHARED-WORKER.sh` on the trusted private LAN and keep it running. When the benchmark path is remembered, use the RPC binary from that same local llama.cpp build tree; do not substitute another downloaded/PATH build.',
          )
          PY
      - name: Scheduler tests
        run: python -m unittest discover -s services/scheduler/tests -v
      - name: llama runtime tests
        run: python -m unittest discover -s runtime/llama/tests -v
      - name: Setup tests
        run: python -m unittest discover -s setup/tests -v
      - name: Commit tested hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.de.md services/scheduler/README.md services/scheduler/experiment_bundle.schema.json runtime/llama/README.md runtime/llama/shared_trial.py runtime/llama/shared_run_evidence.py setup/shared-worker.ps1 setup/SHARED-WORKER.sh setup/tests/test_scripts.py setup/tests/test_linux_setup.py setup/README.md setup/README.de.md state.md
          git diff --cached --quiet && { echo 'No hardening changes produced'; exit 1; }
          git commit -m 'fix(runtime): keep shared worker on benchmark build tree'
