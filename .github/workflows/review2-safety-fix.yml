name: Review2 Side Effect Safety Fix
on:
  push:
    branches: [AgentsPlatform]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: AgentsPlatform
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch side-effect retry and kill-switch enforcement
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_required(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'patch anchor missing in {path}: {old[:100]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_required(
              'services/mcp/platform/tool_execution.py',
              '        attempts = max(1, manifest.retry_limit + 1)\n        result: Any = None\n',
              '        attempts = max(1, manifest.retry_limit + 1)\n'
              '        # A local idempotency record cannot prove that an ambiguous remote write\n'
              '        # did not already happen. Never retry non-idempotent side effects blindly.\n'
              '        if side_effecting and not manifest.idempotent:\n'
              '            attempts = 1\n'
              '        result: Any = None\n'
          )

          replace_required(
              'services/mcp/platform/tool_execution.py',
              '''                if isinstance(result, dict) and result.get("error"):\n                    raise RuntimeError(str(result.get("error")))\n                self.store.success(manifest.tool_id)\n                break\n''',
              '''                normalized_attempt = normalize_tool_result(\n                    manifest.tool_id,\n                    result,\n                    source=manifest.source,\n                    version=manifest.version,\n                )\n                if normalized_attempt.status.value == "FAILURE":\n                    message = normalized_attempt.errors[0] if normalized_attempt.errors else "tool failure"\n                    raise RuntimeError(str(message))\n                self.store.success(manifest.tool_id)\n                break\n'''
          )

          replace_required(
              'services/mcp/tool_registry.py',
              '''        except Exception:\n            pass\n\n        # Check in-memory TTL cache\n''',
              '''        except Exception as exc:\n            return {\n                "error": (\n                    "Tool-Ausführung blockiert: übergeordnete Sicherheitsprüfung "\n                    f"ist nicht verfügbar ({exc})"\n                )\n            }\n\n        # Check in-memory TTL cache\n'''
          )

          replace_required(
              'services/mcp/platform/runtime.py',
              '''                owner_id=owner_id,\n                allowed_tools=self._policy_allowed_tools(runtime_policy),\n''',
              '''                # The legacy ToolRegistry uses owner_id as the fleet-scoped\n                # emergency-stop key. A private policy therefore binds that safety scope\n                # to its fleet_id instead of trusting a second caller-controlled value.\n                owner_id=(runtime_policy.fleet_id if runtime_policy and runtime_policy.fleet_id else owner_id),\n                allowed_tools=self._policy_allowed_tools(runtime_policy),\n'''
          )
          PY

          python -m compileall -q services/mcp/platform services/mcp/tool_registry.py
          python -m unittest services.mcp.tests.test_agents_review2_safety -v
          python -m unittest services.mcp.tests.test_agents_platform services.mcp.tests.test_mcp_agent_hardening -v
          git diff --check

      - name: Commit safety fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mcp/platform/tool_execution.py services/mcp/platform/runtime.py services/mcp/tool_registry.py
          git commit -m "Review2: fail closed on write retries and kill-switch errors"
          git push origin HEAD:AgentsPlatform
