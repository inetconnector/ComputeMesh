name: shared-trial-validation

on:
  push:
    branches: [m1/shared-trial-runner]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: llama runtime tests
        run: python -m unittest discover -s runtime/llama/tests -v
      - name: network runtime tests
        run: python -m unittest discover -s runtime/network/tests -v
      - name: scheduler tests
        run: python -m unittest discover -s services/scheduler/tests -v
      - name: setup tests
        run: python -m unittest discover -s setup/tests -v
