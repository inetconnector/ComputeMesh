name: Agents Platform CI

on:
  push:
    branches: [AgentsPlatform]
  pull_request:
    branches: [main]
    paths:
      - 'services/mcp/platform/**'
      - 'services/mcp/tests/test_agents_platform.py'
      - 'services/mcp/tests/test_agents_routing_eval.py'
      - 'services/mcp/tests/test_agents_workflow.py'
      - 'services/mcp/tests/data/agents_routing_eval.json'
      - 'services/memory/structured_memory.py'
      - 'services/memory/__init__.py'
      - 'services/mcp/config.py'
      - 'services/mcp/__init__.py'
      - 'skills/**'
      - 'AGENTS.md'
      - 'TOOLS.md'
      - 'MEMORY.md'
      - 'PROJECT_STATE.md'

permissions:
  contents: read

jobs:
  agents-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPUTEMESH_INFERENCE_BACKEND: synthetic
      COMPUTEMESH_ALLOW_SYNTHETIC_INFERENCE: '1'
      COMPUTEMESH_AGENTS_PLATFORM_ENABLED: 'true'
      COMPUTEMESH_AGENTS_PLATFORM_SHADOW_MODE: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Agents Platform
        run: |
          python -m compileall -q services/mcp/platform services/memory services/mcp/config.py services/mcp/__init__.py

      - name: Agents Platform contract tests
        run: python -m unittest services.mcp.tests.test_agents_platform -v

      - name: Routing evaluation dataset
        run: python -m unittest services.mcp.tests.test_agents_routing_eval -v

      - name: DAG workflow engine tests
        run: python -m unittest services.mcp.tests.test_agents_workflow -v

      - name: Existing skill execution regression
        run: python -m unittest services.mcp.tests.test_skill_execution -v

      - name: Existing MCP agent hardening regression
        run: python -m unittest services.mcp.tests.test_mcp_agent_hardening -v

      - name: Existing MCP system regression
        run: python -m unittest services.mcp.tests.test_mcp_system -v

      - name: Full ComputeMesh regression
        run: python run_all_tests.py
