name: Temporary update canonical state handoff

on:
  push:
    branches: [docs/state-current-handoff]
    paths:
      - .github/workflows/temporary-update-state-handoff.yml

permissions:
  contents: write

jobs:
  update-state:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/state-current-handoff
          fetch-depth: 0

      - name: Update canonical context-free handoff
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('state.md')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one occurrence, found {count}: {old[:100]!r}')
              text = text.replace(old, new, 1)

          replace_once('**Last updated:** 2026-08-22  \n', '**Last updated:** 2026-08-22 13:01 CEST  \n')
          replace_once(
              '**Phase:** M0 foundation with M1 reference identity, controlled llama.cpp runtime/relay tooling, artifact-derived GGUF manifests, bounded two-machine Lab evidence transfer, fail-closed two-node evidence bundling, deterministic two-node feasibility planning, fail-closed shared-run proof binding, one-command physical shared-trial orchestration, and llama.cpp benchmark→runtime build binding; real shared inference is not yet evidenced  \n',
              '**Phase:** M0 foundation with M1 reference identity, controlled llama.cpp runtime/relay tooling, artifact-derived GGUF manifests, bounded two-machine Lab evidence transfer, fail-closed two-node evidence bundling, deterministic two-node feasibility planning, fail-closed shared-run proof binding, one-command physical shared-trial orchestration, and llama.cpp benchmark→runtime build binding; a real single-host Vulkan+RPC loopback attempt now reaches baseline/RPC discovery/relay but fails at shared server start; physical two-machine shared inference is still not evidenced  \n',
          )
          replace_once(
              'This is the canonical engineering handoff. It records what is implemented, what has actually been measured, the current trust/evidence boundaries, and the next experimental steps.\n',
              'This is the canonical engineering handoff. It records what is implemented, what has actually been measured, the current trust/evidence boundaries, the exact repository/branch state, active failures, and the next experimental/programming steps. It must remain sufficient for a new AI model with no chat history to resume work immediately without guessing.\n',
          )
          replace_once('- canonical/default branch: `main`\n', '- canonical/default branch: `main`\n- current `main` HEAD at this handoff: `f822e7170882036834ee4a066ada95bd2117d2b9`\n')
          replace_once(
              '- llama.cpp benchmark→runtime build binding is implemented in PR #13; final cross-platform validation run `32561589482` passed before final state bookkeeping/workflow removal\n',
              '- llama.cpp benchmark→runtime build binding landed through PR #13; final cross-platform validation run `32561589482` passed before final state bookkeeping/workflow removal\n- active integration investigation is isolated in temporary Draft PR #14 (`test/real-llama-rpc-loopback`); it must not be merged as-is\n',
          )

          repo_anchor = '\n## What exists\n'
          branch_section = '''\n## Current repository / branch topology\n\nAs of 2026-08-22 13:01 CEST:\n\n- `main` = `f822e7170882036834ee4a066ada95bd2117d2b9`; this is the canonical merged code/doc state before the current loopback investigation.\n- `m1/runtime-build-binding` is byte-identical to `main` (`ahead 0`, `behind 0`) and is only a stale merged ref.\n- `m1/shared-run-evidence` has no unique commits (`ahead 0`) and is 40 commits behind `main`; it is only a stale merged ref.\n- `m1/shared-trial-runner` has no unique commits (`ahead 0`) and is 11 commits behind `main`; it is only a stale merged ref.\n- `test/real-llama-rpc-loopback` is the only active divergent ref, currently Draft PR #14, head `645e1e51b726b900f4cf35712aedf2319f062d35`, `ahead 11`, `behind 0`. Its net diff versus `main` is intentionally limited to `.github/workflows/temporary-real-llama-rpc-loopback.yml` and `temporary-real-rpc-loopback-result.json`. **Do not merge those temporary files to `main`.**\n- PR #14 is an execution/debug vehicle only. Durable fixes discovered there must be reimplemented/reviewed on a normal feature branch, validated, documented here, and merged without temporary workflow/result files.\n\n'''
          if text.count(repo_anchor) != 1:
              raise SystemExit('repository topology anchor missing/ambiguous')
          text = text.replace(repo_anchor, branch_section + '## What exists\n', 1)

          replace_once(
              '**Boundary:** no actual successful shared local+RPC two-machine inference artifact has yet been recorded. ADR 0002 remains Proposed.\n',
              '**Boundary:** no actual successful shared local+RPC two-machine inference artifact has yet been recorded. A real single-host local+RPC loopback attempt exists and currently fails during shared server startup; see the dedicated 2026-08-22 loopback evidence section below. ADR 0002 remains Proposed.\n',
          )

          target_anchor = '\n## Real target-machine evidence from 2026-08-21\n'
          loopback_section = '''\n## Real single-host llama.cpp RPC loopback evidence from 2026-08-22\n\nPurpose: exercise the real llama.cpp/ComputeMesh software path with real binaries and a real GGUF before touching the two physical target machines. This is **not** physical two-machine evidence and must not be presented as distributed target-machine inference. The execution/debug artifacts currently live only on temporary Draft PR #14.\n\n### Exact test ingredients\n\n- temporary branch: `test/real-llama-rpc-loopback`; Draft PR #14; current recorded head `645e1e51b726b900f4cf35712aedf2319f062d35`;\n- upstream source tag selected/built: llama.cpp `b10580`; correct RPC CMake target is `ggml-rpc-server`;\n- runtime self-report captured by the baseline harness: `version: 0.2.0-dev (build 1, commit 54ee5ee)`, built with GNU 13.3.0 for Linux x86_64;\n- Ubuntu 24.04 GitHub runner using Mesa llvmpipe with the same headless conditions used by upstream Vulkan CI: `GGML_VK_VISIBLE_DEVICES=0`, `GGML_VK_DISABLE_F16=1`, `GGML_VK_DISABLE_COOPMAT=1`;\n- Vulkan enumeration succeeded: `Vulkan0 = llvmpipe (LLVM 20.1.8, 256 bits)`;\n- RPC server self-report: `Starting RPC server v5.1.0`, endpoint `127.0.0.1:50052`, device `Vulkan0`;\n- real model: `SmolLM2-135M-Instruct-Q4_K_M.gguf`, exact size `105454144` bytes, SHA-256 `ed5fa30c487b282ec156c29062f1222e5c20875a944ac98289dbd242e947f747`.\n\n### What succeeded\n\n1. llama.cpp Vulkan + RPC source build completed with the required `llama-server` and `ggml-rpc-server` targets.\n2. Local discovery exposed `Vulkan0`.\n3. With direct RPC endpoint `127.0.0.1:50052`, `llama-server --list-devices` exposed both `Vulkan0` and `RPC0`.\n4. A real local baseline inference completed successfully on `Vulkan0` (`run_id = llama-rpc-d0c95fa99a902227`). Baseline timing recorded `model_ready_ms = 18331.510482`, `request_ms = 12441.638347`, 14 prompt tokens in 8886.915 ms and 18 predicted tokens in 3553.042 ms. Correctness digests were persisted without raw prompt/output.\n5. A fresh zero-delay ComputeMesh relay started at `127.0.0.1:50053` targeting the RPC worker at `127.0.0.1:50052`. The relay recorded one real connection, clean EOF, 42 coordinator→worker bytes, 48 worker→coordinator bytes, 90 total forwarded bytes, `active_elapsed_ms = 51.300458`, and `total_elapsed_ms = 349.565246`.\n\n### What failed\n\nThe relayed shared run did **not** reach model-ready/inference. `runtime.llama.rpc_spike run` failed in phase `server_start` with:\n\n```text\nConnectionResetError: [Errno 104] Connection reset by peer\n```\n\nNo `shared` result, `comparison.json`, or valid `shared_run_evidence.json` was produced. Therefore there is still no successful shared local+RPC proof. The 90 relay bytes are RPC/control traffic from the failed startup path, not activation-tensor accounting and not evidence of distributed model execution.\n\n### Leading blocker hypothesis — verify before changing contracts\n\n`runtime/network/tcp_relay.py` currently exposes `run_relay_once(...)` whose contract is explicitly **“Relay one TCP connection”** and whose listener accepts exactly one coordinator socket before leaving the accept loop. During the real experiment, `ggml-rpc-server` logged multiple accepted/closed client connections while the one-shot measurement relay ended after the first short 90-byte exchange. The strongest current hypothesis is therefore that current llama.cpp RPC startup uses multiple sequential TCP connections and the one-connection measurement relay disappears too early, causing the subsequent `ConnectionResetError`.\n\nThis is a hypothesis, not yet proof. The next diagnostic must distinguish relay topology from an upstream local+RPC split failure:\n\n1. using the same built binaries, same GGUF and the already discovered `Vulkan0`/`RPC0`, execute the shared `rpc_spike run` **directly against `127.0.0.1:50052` with no ComputeMesh relay**;\n2. if direct local+RPC succeeds, instrument/confirm the number and lifecycle of RPC TCP connections, then design a bounded multi-connection measurement relay/session aggregator rather than weakening the runtime proof;\n3. if direct local+RPC also fails, debug the exact llama.cpp b10580 device/split/server startup semantics first and do not blame or redesign the relay;\n4. only after a correct direct shared run and a correct relayed shared run should the temporary PR #14 be closed/cleaned and durable tests/code be merged.\n\n'''
          if text.count(target_anchor) != 1:
              raise SystemExit('target evidence anchor missing/ambiguous')
          text = text.replace(target_anchor, loopback_section + '## Real target-machine evidence from 2026-08-21\n', 1)

          blockers_anchor = '## What does not exist / current blockers\n\n'
          replace_once(blockers_anchor, blockers_anchor + '- immediate software blocker: the real single-host shared path currently resets during `server_start` when routed through the one-connection measurement relay; direct-without-relay A/B diagnosis is the next required experiment;\n- if direct RPC succeeds, current relay connection-lifecycle/metrics aggregation is insufficient for llama.cpp RPC startup and needs a bounded multi-connection design before proof generation;\n')

          start = text.index('## Next actions in order\n')
          end_marker = 'Before any public authenticated node service'
          end = text.index(end_marker, start)
          next_actions = '''## Next actions in order\n\n### Immediate software diagnosis — do this first\n\n1. Continue the isolated loopback investigation from Draft PR #14 evidence, but **do not merge PR #14** or its temporary workflow/result files. Reproduce with the same real GGUF and source-built llama.cpp b10580 binaries.\n2. Run the exact shared local+RPC configuration directly against `127.0.0.1:50052` **without** `runtime/network/tcp_relay.py`. Preserve bounded failure/result evidence. This is the decisive A/B test.\n3. If direct local+RPC fails, determine the upstream llama.cpp server/device/tensor-split cause using the exact `Vulkan0` + `RPC0` topology; fix only what is required and rerun baseline/direct shared correctness.\n4. If direct local+RPC succeeds, confirm how many sequential/concurrent TCP connections llama.cpp RPC opens during server startup/inference. Current `run_relay_once` accepts exactly one connection and is the leading cause of the observed reset.\n5. If multiple connections are required, implement a bounded multi-connection relay/session measurement design with explicit limits, per-connection plus aggregate opaque byte/timing accounting, deterministic shutdown, and no payload persistence. Preserve trusted-private-target restrictions. Update relay schema/proof binding deliberately rather than silently changing semantics.\n6. Add regression/integration tests proving the relay handles the observed real RPC connection lifecycle and that single-connection behavior remains bounded/fail-closed where applicable. Run the full Windows/Ubuntu matrix.\n7. Repeat the real single-host test: baseline → relayed shared local+RPC → exact correctness compare → bounded proof. Require non-null shared result and comparison before claiming software-path success.\n8. Move only durable code/tests/docs to a normal feature branch, update this `state.md` with exact run IDs/results, remove all temporary workflow/result files, merge workflow-free, close PR #14, and clean stale refs when tooling permits.\n\n### Then perform the physical two-machine proof\n\n9. Put the **same complete GGUF** on both physical target machines. If it is a llama.cpp shard set, merge all shards first.\n10. Capture a fresh current node profile on both machines.\n11. Run fresh llama-bench prefill/decode on both machines for that exact same GGUF and exact size, using llama.cpp builds with the same concrete build number/commit on both nodes; the current bundle rejects cross-build benchmark evidence.\n12. On the trusted private LAN, capture fresh A→B and B→A network measurements with current embedded Lab IDs; choose A as coordinator after reviewing directionality.\n13. On worker B, run `setup\\EVIDENCE-EXPORT.cmd` or `bash setup/EVIDENCE-EXPORT.sh`; copy the resulting ZIP to A through a trusted local transfer method.\n14. On A, generate the ComputeMesh model manifest from the exact same complete GGUF with `tools/benchmark/gguf_manifest.py` so digest, size, architecture and `layer_count` come from the artifact rather than manual entry.\n15. On A, run `setup\\BUILD-BUNDLE.cmd` or `bash setup/BUILD-BUNDLE.sh`; retain the verified peer import and resulting `experiment_bundle.json`. Do not use legacy peer/layer assertions.\n16. Inspect the bundle's embedded hard constraints/recommendation. If it is not `shared_experiment`, fix the measured feasibility issue rather than forcing a split.\n17. On worker B, start `setup\\SHARED-WORKER.cmd` or `bash setup/SHARED-WORKER.sh` on the trusted private LAN and keep it running. Use the RPC binary from the same remembered llama.cpp build tree; do not silently substitute a different downloaded/PATH build.\n18. On coordinator A, run `setup\\SHARED-PROOF.cmd` or `bash setup/SHARED-PROOF.sh`, select the exact current bundle/GGUF, and provide B's private IP. Require model/freshness/build/device/RPC preflight and then baseline → zero-delay relay → exact planner split → compare → proof binding without manual split overrides.\n19. Require a real `shared_run_evidence.json` with exact correctness and inspect relay byte/timing evidence. Do not promote the planner or ADR 0002 based on a failed/preflight-only run.\n20. Repeat controlled delay/jitter/disconnect experiments separately from the unperturbed first proof; use controlled OS/network emulation if packet loss/reordering becomes material.\n21. Accept, reject or supersede ADR 0002 from measured evidence, then calibrate scheduler ranking from the correct shared result instead of invented coefficients.\n22. Bind only the minimum artifact/runtime/result/failure messages required by the winning path and continue toward reproducible correct two-node inference under ComputeMesh control.\n\n'''
          text = text[:start] + next_actions + text[end:]

          handoff_anchor = '\n## Bilingual README rule\n'
          handoff_section = '''\n## Canonical state handoff rule\n\n`state.md` is the mandatory context-free engineering handoff for this repository. It must be updated **during the same work block** whenever any of the following materially changes: merged implementation, test counts/results, physical or synthetic evidence, trust/evidence boundaries, active branch/PR topology, known failures, blockers, or the ordered next programming/experimental actions.\n\nThe standard is operational, not cosmetic: a new AI model must be able to read `state.md` alone, inspect the referenced files/commits as needed, and immediately continue the project safely and accurately without access to prior chat history. Therefore:\n\n- record exact branch/PR/SHA/run IDs when they matter to continuation;\n- distinguish merged truth from temporary branch/debug artifacts;\n- distinguish real evidence from synthetic/loopback evidence and hypotheses;\n- preserve exact failure phase/type and the leading diagnostic, but label hypotheses as hypotheses;\n- state what must **not** be merged or claimed;\n- keep blockers and next actions ordered to the actual current bottleneck;\n- update this file before declaring a milestone/work block complete.\n\n'''
          if text.count(handoff_anchor) != 1:
              raise SystemExit('handoff rule anchor missing/ambiguous')
          text = text.replace(handoff_anchor, handoff_section + '## Bilingual README rule\n', 1)

          path.write_text(text, encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state.md
          git rm .github/workflows/temporary-update-state-handoff.yml
          git diff --cached --check
          git commit -m 'docs(state): refresh canonical context-free handoff'
          git push origin HEAD:docs/state-current-handoff
