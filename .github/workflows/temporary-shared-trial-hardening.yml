name: Temporary shared-trial hardening

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'm1/shared-trial-runner' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/shared-trial-runner
          fetch-depth: 0
      - name: Apply fail-closed runtime hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          source = Path('runtime/llama/shared_trial.py')
          replace_once(
              source,
              '''    coordinator = placement["nodes"]["coordinator"]\n    worker = placement["nodes"]["worker"]\n    ranges = candidate["layer_ranges"]\n''',
              '''    coordinator = placement["nodes"]["coordinator"]\n    worker = placement["nodes"]["worker"]\n    if coordinator["kind"] == "cpu":\n        raise SharedTrialError(\n            "one-command shared trial currently requires an accelerator-backed coordinator; "\n            "local CPU + RPC tensor-split is not represented safely by this M1 runner"\n        )\n    ranges = candidate["layer_ranges"]\n''',
          )
          replace_once(
              source,
              '''        plan = load_trial_plan(bundle_path, model_path)\n        phase = "runtime_version"\n        version = runtime_version(llama_server)\n''',
              '''        plan = load_trial_plan(bundle_path, model_path)\n        phase = "runtime_version"\n        if llama_server.is_symlink() or not llama_server.is_file():\n            raise SharedTrialError("llama-server must be an existing non-symlink file")\n        version = runtime_version(llama_server)\n''',
          )
          replace_once(
              source,
              '''        remote_listing = preflight_server_rpc(llama_server, worker_rpc, llama_cli=llama_cli)\n        selected_rpc = choose_rpc_device(remote_listing, rpc_device)\n\n        phase = "baseline"\n''',
              '''        remote_listing = preflight_server_rpc(llama_server, worker_rpc, llama_cli=llama_cli)\n        if not any(device.name == selected_local for device in _local_devices(remote_listing)):\n            raise SharedTrialError(\n                "llama-server RPC preflight no longer exposes the selected coordinator device"\n            )\n        selected_rpc = choose_rpc_device(remote_listing, rpc_device)\n\n        phase = "baseline"\n''',
          )

          tests = Path('runtime/llama/tests/test_shared_trial.py')
          replace_once(
              tests,
              '''    def test_load_trial_plan_rejects_wrong_model_or_forced_nonshared_bundle(self):\n''',
              '''    def test_load_trial_plan_rejects_cpu_coordinator_for_automated_split(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp); model = root / "model.gguf"; model.write_bytes(b"abc")\n            value = valid_bundle_for_model(model)\n            value["placement_decision"]["nodes"]["coordinator"]["kind"] = "cpu"\n            value["placement_decision"]["nodes"]["coordinator"]["name"] = "Intel CPU"\n            bundle_path = root / "bundle.json"; bundle_path.write_text(json.dumps(value), encoding="utf-8")\n            with self.assertRaisesRegex(SharedTrialError, "accelerator-backed coordinator"):\n                load_trial_plan(bundle_path, model, now=NOW)\n\n    def test_load_trial_plan_rejects_wrong_model_or_forced_nonshared_bundle(self):\n''',
          )
          replace_once(
              tests,
              '''    def test_runner_retains_bounded_failure_record_on_correctness_mismatch(self):\n''',
              '''    def test_runner_rejects_rpc_preflight_that_drops_selected_local_device(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            root = Path(tmp); output = root / "trial"\n            server = root / "llama-server"; server.write_bytes(b"x")\n            model = root / "model.gguf"; model.write_bytes(b"abc")\n            bundle_path = root / "bundle.json"; bundle_path.write_text("{}", encoding="utf-8")\n            with patch("runtime.llama.shared_trial.load_trial_plan", return_value=plan()), \\\n                 patch("runtime.llama.shared_trial.runtime_version", return_value="build 1"), \\\n                 patch("runtime.llama.shared_trial.discover_devices", return_value=(DeviceInfo("CUDA0", plan().coordinator_name),)), \\\n                 patch("runtime.llama.shared_trial.preflight_server_rpc", return_value=(DeviceInfo("CUDA1", "different local"), DeviceInfo("RPC0", "remote"))):\n                with self.assertRaisesRegex(SharedTrialError, "no longer exposes"):\n                    run_shared_trial(\n                        bundle_path=bundle_path,\n                        llama_server=server,\n                        model_path=model,\n                        worker_rpc=RpcEndpoint.parse("192.168.1.20:50052"),\n                        output_dir=output,\n                    )\n            failure = json.loads((output / "shared_trial_failure.json").read_text(encoding="utf-8"))\n            self.assertEqual(failure["phase"], "rpc_preflight")\n\n    def test_runner_retains_bounded_failure_record_on_correctness_mismatch(self):\n''',
          )
          replace_once(
              tests,
              '''                 patch("runtime.llama.shared_trial.preflight_server_rpc", return_value=(DeviceInfo("RPC0", "remote"),)), \\\n''',
              '''                 patch("runtime.llama.shared_trial.preflight_server_rpc", return_value=(DeviceInfo("CUDA0", "local"), DeviceInfo("RPC0", "remote"))), \\\n''',
          )
          PY
          rm -f .github/workflows/temporary-shared-trial-hardening.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add runtime/llama/shared_trial.py runtime/llama/tests/test_shared_trial.py .github/workflows
          git diff --cached --check
          git commit -m 'fix(runtime): harden automated shared split boundary'
          git push origin HEAD:m1/shared-trial-runner
