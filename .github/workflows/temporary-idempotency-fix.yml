name: Temporary Evidence Idempotency Fix

on:
  push:
    branches: [m1/lab-evidence-transfer]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: m1/lab-evidence-transfer
      - name: Apply idempotency regression fix once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          code = Path('setup/evidence_transfer.py')
          text = code.read_text(encoding='utf-8')
          old = '''    if existing_manifest != manifest:
              raise EvidenceTransferError("existing import manifest conflicts with archive")
          '''
          new = '''    identity_keys = ("schema_version", "export_id", "node_id", "profile_revision", "files")
              if any(existing_manifest[key] != manifest[key] for key in identity_keys):
                  raise EvidenceTransferError("existing import manifest conflicts with archive")
          '''
          if old in text:
              code.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('setup/tests/test_evidence_transfer.py')
          t = tests.read_text(encoding='utf-8')
          marker = '    def test_repeated_export_with_new_created_at_reuses_same_import_identity(self):\n'
          if marker not in t:
              anchor = '    def test_import_rejects_modified_evidence_bytes(self):\n'
              addition = '''    def test_repeated_export_with_new_created_at_reuses_same_import_identity(self):
                  node_root = self.root / "lab-worker01"
                  write_node(node_root, "lab-worker01", gpu_memory=6_000_000_000)
                  first_archive = self.root / "first.zip"
                  second_archive = self.root / "second.zip"
                  first = transfer.export_node_evidence(
                      node_root=node_root,
                      node_id="lab-worker01",
                      profile_revision=3,
                      export_root=self.exports,
                      destination=first_archive,
                      now=datetime(2026, 8, 22, 3, 0, tzinfo=timezone.utc),
                  )
                  second = transfer.export_node_evidence(
                      node_root=node_root,
                      node_id="lab-worker01",
                      profile_revision=3,
                      export_root=self.exports,
                      destination=second_archive,
                      now=datetime(2026, 8, 22, 4, 0, tzinfo=timezone.utc),
                  )
                  self.assertEqual(first.export_id, second.export_id)
                  imported_first = transfer.import_node_export(
                      archive_path=first.archive, import_root=self.imports
                  )
                  imported_second = transfer.import_node_export(
                      archive_path=second.archive, import_root=self.imports
                  )
                  self.assertEqual(imported_first.evidence_root, imported_second.evidence_root)
                  self.assertEqual(imported_first.export_id, imported_second.export_id)

          '''
              if anchor not in t:
                  raise SystemExit('test insertion anchor missing')
              tests.write_text(t.replace(anchor, addition + anchor, 1), encoding='utf-8')
          PY
          if git diff --quiet; then
            echo 'Patch already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add setup/evidence_transfer.py setup/tests/test_evidence_transfer.py
          git commit -m 'fix(setup): make repeated evidence exports import-idempotent'
          git push origin HEAD:m1/lab-evidence-transfer
