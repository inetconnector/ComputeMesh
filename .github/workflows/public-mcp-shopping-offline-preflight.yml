name: Public MCP shopping offline preflight

on:
  push:
    branches:
      - codex/mcp-price-provenance-20261101
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-shopping-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Prepare dependency-only image and record resolved identity
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/Dockerfile.cm-test" <<'EOF'
          FROM python:3.11.18-slim-bookworm@sha256:94a8fee35252d06ab75856f15f12c7bae67b10e8a6da93c7fded82b2610926cd
          RUN python -m pip install --no-cache-dir pytest==9.0.2 cryptography==46.0.4 requests==2.32.5 beautifulsoup4==4.14.2 Pillow==12.0.0 pydantic==2.12.4 jsonschema==4.25.1
          ENV PYTHONDONTWRITEBYTECODE=1 PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          USER 10001:10001
          EOF
          docker build --pull --file "$RUNNER_TEMP/Dockerfile.cm-test" --tag cm-mcp-offline:ci "$RUNNER_TEMP"
          docker image inspect cm-mcp-offline:ci --format 'Preflight image ID {{.Id}}'
          printf 'Source SHA: %s\n' "$GITHUB_SHA"
      - name: Isolated MCP price provenance tests
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 128 --memory 2g --cpus 2 \
            --tmpfs /tmp:rw,nosuid,nodev,mode=1777,size=128m \
            --tmpfs /work:rw,nosuid,nodev,mode=1777,size=768m \
            --user 10001:10001 \
            --env COMPUTEMESH_NODE_AUTH_TOKEN_PATH=/tmp/computemesh-ci-node-token.txt \
            --env HOME=/tmp \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --workdir /work cm-mcp-offline:ci \
            sh -ec 'cp -R /src/. /work/; python -m pytest -q -p no:cacheprovider services/mcp/tests/test_product_price_engine.py'
