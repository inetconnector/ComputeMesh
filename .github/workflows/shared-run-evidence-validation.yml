name: shared-run-evidence-validation

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate llama runtime suite
        run: python -m unittest discover -s runtime/llama/tests -p "test_*.py" -v
      - name: Validate scheduler suite
        run: python -m unittest discover -s services/scheduler/tests -p "test_*.py" -v
      - name: Validate network relay suite
        run: python -m unittest discover -s runtime/network/tests -p "test_*.py" -v
