name: Temporary real llama.cpp RPC loopback
on:
  push:
    branches: [test/real-llama-rpc-loopback]
concurrency:
  group: real-llama-rpc-loopback
  cancel-in-progress: true
permissions:
  contents: write
jobs:
  real-rpc-loopback:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      LLAMA_TAG: b10580
      GGML_VK_VISIBLE_DEVICES: '0'
      GGML_VK_DISABLE_F16: '1'
      GGML_VK_DISABLE_COOPMAT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Build real Vulkan RPC binaries
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/cm-real/out; mkdir -p "$OUT"; echo dependencies > "$OUT/phase.txt"
          sudo add-apt-repository -y ppa:kisak/kisak-mesa
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build git curl ca-certificates mesa-vulkan-drivers vulkan-tools libvulkan-dev glslc spirv-headers libxcb-xinput0 libxcb-xinerama0 libxcb-cursor-dev libssl-dev
          vulkaninfo --summary > "$OUT/vulkaninfo.txt" 2>&1 || true
          echo clone > "$OUT/phase.txt"
          git clone --depth 1 --branch "$LLAMA_TAG" https://github.com/ggml-org/llama.cpp /tmp/cm-real/llama-src
          echo configure > "$OUT/phase.txt"
          cmake -S /tmp/cm-real/llama-src -B /tmp/cm-real/llama-src/build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGGML_NATIVE=OFF -DGGML_VULKAN=ON -DGGML_RPC=ON -DLLAMA_BUILD_SERVER=ON -DLLAMA_CURL=OFF
          echo build > "$OUT/phase.txt"
          cmake --build /tmp/cm-real/llama-src/build --config Release --target llama-server ggml-rpc-server -j 4 2>&1 | tee "$OUT/build.log"
          SERVER=/tmp/cm-real/llama-src/build/bin/llama-server
          RPC=/tmp/cm-real/llama-src/build/bin/ggml-rpc-server
          test -x "$SERVER" && test -x "$RPC"
          echo "SERVER=$SERVER" >> "$GITHUB_ENV"; echo "RPC=$RPC" >> "$GITHUB_ENV"
          "$SERVER" --version | tee "$OUT/llama-version.txt"
          "$SERVER" --list-devices 2>&1 | tee "$OUT/local-devices-preflight.txt"
      - name: Download verified real GGUF
        shell: bash
        run: |
          set -euo pipefail; echo model_download > /tmp/cm-real/out/phase.txt
          curl -fL --retry 3 --retry-delay 2 'https://huggingface.co/unsloth/SmolLM2-135M-Instruct-GGUF/resolve/main/SmolLM2-135M-Instruct-Q4_K_M.gguf?download=true' -o /tmp/cm-real/SmolLM2-135M-Instruct-Q4_K_M.gguf
          echo 'ed5fa30c487b282ec156c29062f1222e5c20875a944ac98289dbd242e947f747  /tmp/cm-real/SmolLM2-135M-Instruct-Q4_K_M.gguf' | sha256sum -c -
      - name: Execute baseline RPC relay shared compare
        shell: bash
        run: |
          set -euo pipefail
          OUT=/tmp/cm-real/out; MODEL=/tmp/cm-real/SmolLM2-135M-Instruct-Q4_K_M.gguf; RPC_PID=''; RELAY_PID=''
          cleanup(){ [ -z "$RELAY_PID" ] || kill "$RELAY_PID" 2>/dev/null || true; [ -z "$RPC_PID" ] || kill "$RPC_PID" 2>/dev/null || true; }; trap cleanup EXIT
          echo local_discovery > "$OUT/phase.txt"; "$SERVER" --list-devices 2>&1 | tee "$OUT/local-devices.txt"
          LOCALDEV="$(awk -F: '/^[[:space:]]*[A-Za-z0-9_.-]+:[[:space:]]/ && $1 !~ /RPC/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}' "$OUT/local-devices.txt")"; test -n "$LOCALDEV" || exit 31
          echo rpc_start > "$OUT/phase.txt"; "$RPC" --host 127.0.0.1 --port 50052 > "$OUT/rpc-server.log" 2>&1 & RPC_PID=$!; sleep 1; kill -0 "$RPC_PID"
          echo rpc_discovery > "$OUT/phase.txt"; python -m runtime.llama.rpc_spike discover --llama-server "$SERVER" --rpc 127.0.0.1:50052 2>&1 | tee "$OUT/discover.txt"
          "$SERVER" --offline --rpc 127.0.0.1:50052 --list-devices 2>&1 | tee "$OUT/rpc-devices.txt"
          RPCDEV="$(awk -F: '/^[[:space:]]*RPC[0-9]+:[[:space:]]/ {gsub(/^[[:space:]]+|[[:space:]]+$/, "", $1); print $1; exit}' "$OUT/rpc-devices.txt")"; test -n "$RPCDEV" || exit 33
          echo baseline > "$OUT/phase.txt"; python -m runtime.llama.rpc_spike baseline --llama-server "$SERVER" --model "$MODEL" --devices "$LOCALDEV" --output-dir "$OUT/baseline"
          echo relay_start > "$OUT/phase.txt"; python -u -m runtime.network.tcp_relay --target 127.0.0.1:50052 --listen-port 50053 --metrics "$OUT/relay.json" > "$OUT/relay.log" 2>&1 & RELAY_PID=$!
          for i in $(seq 1 100); do grep -q '^READY ' "$OUT/relay.log" && break; kill -0 "$RELAY_PID" 2>/dev/null || { cat "$OUT/relay.log"; exit 34; }; sleep 0.1; done; grep '^READY ' "$OUT/relay.log"
          echo shared > "$OUT/phase.txt"; python -m runtime.llama.rpc_spike run --llama-server "$SERVER" --model "$MODEL" --rpc 127.0.0.1:50053 --devices "$LOCALDEV,$RPCDEV" --tensor-split 1,1 --output-dir "$OUT/shared"
          wait "$RELAY_PID"; RELAY_PID=''; echo compare > "$OUT/phase.txt"
          python -m runtime.llama.rpc_spike compare --baseline "$OUT/baseline/runtime_spike_result.json" --shared "$OUT/shared/runtime_spike_result.json" --output "$OUT/comparison.json"
          echo success > "$OUT/phase.txt"
      - name: Persist bounded result
        if: always()
        shell: bash
        env: {JOB_STATUS: '${{ job.status }}'}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,os
          from pathlib import Path
          o=Path('/tmp/cm-real/out')
          def t(n,l=12000):
            p=o/n; return p.read_text(encoding='utf-8',errors='replace')[:l] if p.is_file() else None
          def j(n):
            p=o/n
            if not p.is_file(): return None
            try:return json.loads(p.read_text())
            except Exception as e:return {'read_error':type(e).__name__}
          r={'schema_version':1,'job_status':os.getenv('JOB_STATUS'),'phase':t('phase.txt',256),'llama_tag':os.getenv('LLAMA_TAG'),'model':{'basename':'SmolLM2-135M-Instruct-Q4_K_M.gguf','sha256':'ed5fa30c487b282ec156c29062f1222e5c20875a944ac98289dbd242e947f747'},'llama_version':t('llama-version.txt',4096),'vulkaninfo':t('vulkaninfo.txt'),'build_log':t('build.log'),'local_devices_preflight':t('local-devices-preflight.txt'),'local_devices':t('local-devices.txt'),'rpc_devices':t('rpc-devices.txt'),'discover':t('discover.txt'),'baseline':j('baseline/runtime_spike_result.json'),'baseline_failure':j('baseline/runtime_spike_failure.json'),'shared':j('shared/runtime_spike_result.json'),'shared_failure':j('shared/runtime_spike_failure.json'),'relay':j('relay.json'),'comparison':j('comparison.json'),'relay_log':t('relay.log'),'rpc_server_log':t('rpc-server.log')}
          Path('temporary-real-rpc-loopback-result.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'; git add temporary-real-rpc-loopback-result.json
          git diff --cached --quiet && exit 0; git commit -m 'test: persist real llama.cpp RPC loopback result'; git push origin HEAD:test/real-llama-rpc-loopback
      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@v4
        with: {name: real-llama-rpc-loopback-evidence, path: /tmp/cm-real/out, retention-days: 1}
