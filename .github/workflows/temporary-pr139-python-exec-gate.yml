name: Temporary PR139 P0 Unsafe Python Execution Gate
on:
  push:
    branches:
      - release/portal-platform-sync-20261028

permissions:
  contents: read

jobs:
  python-exec-denial:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMPUTEMESH_OWNER_ACCOUNTS_DB_PATH: /tmp/execgate-owner.db
      COMPUTEMESH_ACCOUNTING_DB_PATH: /tmp/execgate-accounting.db
      COMPUTEMESH_FLEET_ACCOUNTS_DB_PATH: /tmp/execgate-fleet.db
      COMPUTEMESH_MODEL_STORAGE_DIR: /tmp/execgate-models
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Assert exact SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Compile security code and negative tests
        run: python3 -m py_compile services/mcp/builtin/python_sandbox.py services/mcp/tests/test_python_sandbox_disabled.py
      - name: Run real no-execution regression with Python unittest
        run: python3 -m unittest services.mcp.tests.test_python_sandbox_disabled -v
