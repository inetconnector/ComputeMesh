name: Review2 Workflow Compatibility Fix
on:
  push:
    branches: [AgentsPlatform]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: AgentsPlatform
          token: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('services/mcp/platform/workflow.py')
          text = p.read_text(encoding='utf-8')
          anchor = '''    def _claim_node(self, workflow_id: str, node: WorkflowNode) -> tuple[str, int] | None:\n'''
          method = '''    def _set_running(self, workflow_id: str, node_id: str, attempts: int) -> None:\n        \"\"\"Compatibility helper used by recovery tests and migration tooling.\n\n        It represents an interrupted legacy RUNNING state, not an active lease.\n        The zero lease expiry makes the node immediately reclaimable on resume.\n        \"\"\"\n        now = time.time()\n        with self._db_lock, self._conn:\n            self._conn.execute(\n                \"UPDATE workflow_nodes SET status='RUNNING',attempts=?,started_at=COALESCE(started_at,?),\"\n                \"error='',updated_at=?,lease_id=NULL,lease_expires_at=0 \"\n                \"WHERE workflow_id=? AND node_id=?\",\n                (attempts, now, now, workflow_id, node_id),\n            )\n\n'''
          if anchor not in text:
              raise SystemExit('workflow patch anchor missing')
          if 'def _set_running(' not in text:
              text = text.replace(anchor, method + anchor, 1)
          p.write_text(text, encoding='utf-8')
          PY
          python -m compileall -q services/mcp/platform/workflow.py
          python -m unittest services.mcp.tests.test_agents_workflow -v
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/mcp/platform/workflow.py
          git commit -m "Review2: preserve interrupted workflow resume compatibility"
          git push origin HEAD:AgentsPlatform
