name: Android Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - 'deploy/android/**'
      - '.github/workflows/android-release.yml'

permissions:
  contents: write

concurrency:
  group: android-release-main
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CM_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      CM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      CM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build dependencies
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'cmake;3.22.1' 'ndk;26.1.10909125'

      - name: Require production signing secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 CM_ANDROID_KEYSTORE_PASSWORD CM_ANDROID_KEY_ALIAS CM_ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing required Android production signing secret: ${name}"
              exit 1
            fi
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/computemesh-release.jks"
          test -s "$RUNNER_TEMP/computemesh-release.jks"
          echo "CM_ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/computemesh-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APK and AAB
        working-directory: apps/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleRelease :app:bundleRelease

      - name: Verify and package release
        run: |
          set -euo pipefail
          APK='apps/android/app/build/outputs/apk/release/app-release.apk'
          AAB='apps/android/app/build/outputs/bundle/release/app-release.aab'
          test -s "$APK"
          test -s "$AAB"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          mkdir -p release-android
          cp "$APK" release-android/ComputeMesh-Android.apk
          cp "$AAB" release-android/ComputeMesh-Android.aab
          python3 - <<'PY'
          import hashlib, json, pathlib, re
          gradle = pathlib.Path('apps/android/app/build.gradle.kts').read_text(encoding='utf-8')
          version_name = re.search(r'versionName\s*=\s*"([^"]+)"', gradle).group(1)
          version_code = int(re.search(r'versionCode\s*=\s*(\d+)', gradle).group(1))
          out = pathlib.Path('release-android')
          apk = out / 'ComputeMesh-Android.apk'
          aab = out / 'ComputeMesh-Android.aab'
          def digest(path):
              h = hashlib.sha256()
              with path.open('rb') as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b''):
                      h.update(chunk)
              return h.hexdigest()
          metadata = {
              'app_name': 'ComputeMesh',
              'package_name': 'com.inetconnector.compumesh',
              'version': version_name,
              'version_name': version_name,
              'versionCode': version_code,
              'version_code': version_code,
              'min_sdk': 29,
              'target_sdk': 34,
              'sha256': digest(apk),
              'apk_sha256': digest(apk),
              'size': apk.stat().st_size,
              'apk_size': apk.stat().st_size,
              'aab_sha256': digest(aab),
              'aab_size': aab.stat().st_size,
              'url': 'https://mesh.inetconnector.com/downloads/ComputeMesh-Android.apk',
              'aab_url': 'https://mesh.inetconnector.com/downloads/ComputeMesh-Android.aab',
              'github_release_tag': 'android-latest',
              'production_signed': True,
          }
          (out / 'ComputeMesh-Android.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          PY
          sha256sum release-android/ComputeMesh-Android.apk release-android/ComputeMesh-Android.aab

      - name: Publish stable Android release assets
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('release-android/ComputeMesh-Android.json'))['version'])")
          if gh release view android-latest --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit android-latest --repo "$GITHUB_REPOSITORY" --title "ComputeMesh Android ${VERSION}" --notes "Latest signed ComputeMesh Android APK/AAB. Assets are built from main and verified before publication."
          else
            gh release create android-latest --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "ComputeMesh Android ${VERSION}" --notes "Latest signed ComputeMesh Android APK/AAB. Assets are built from main and verified before publication."
          fi
          gh release upload android-latest \
            release-android/ComputeMesh-Android.apk \
            release-android/ComputeMesh-Android.aab \
            release-android/ComputeMesh-Android.json \
            --clobber --repo "$GITHUB_REPOSITORY"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: computemesh-android-release
          path: release-android/
          if-no-files-found: error
          retention-days: 14
