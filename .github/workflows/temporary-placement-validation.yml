name: Temporary Placement Validation

on:
  push:
    branches: [m1/two-node-placement]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Final branch-state validation; this file is removed before main is advanced.
jobs:
  matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Scheduler placement tests
        run: python -m unittest discover -s services/scheduler/tests -v
      - name: Existing benchmark tests
        run: python -m unittest discover -s tools/benchmark/tests -v
      - name: Existing orchestrator tests
        run: python -m unittest discover -s services/orchestrator/tests -v
      - name: Existing protocol tests
        run: python -m unittest discover -s protocol/tests -v
      - name: Existing identity tests
        run: python -m unittest discover -s services/identity/tests -v
      - name: Existing llama runtime tests
        run: python -m unittest discover -s runtime/llama/tests -v
      - name: Existing network runtime tests
        run: python -m unittest discover -s runtime/network/tests -v
      - name: Existing setup tests
        run: python -m unittest discover -s setup/tests -v
