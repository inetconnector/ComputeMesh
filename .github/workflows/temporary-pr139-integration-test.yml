name: Temporary PR139 Mobile Integration Tests
on:
  push:
    branches:
      - release/portal-platform-sync-20261028

permissions:
  contents: read

jobs:
  mobile-python:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      COMPUTEMESH_INFERENCE_BACKEND: synthetic
      COMPUTEMESH_ALLOW_SYNTHETIC_INFERENCE: "1"
      COMPUTEMESH_ALLOW_STATIC_MODEL_CATALOG: "1"
      COMPUTEMESH_ACCOUNTING_DB_PATH: /tmp/computemesh-accounting-pr139.db
      COMPUTEMESH_OWNER_ACCOUNTS_DB_PATH: /tmp/computemesh-owners-pr139.db
      COMPUTEMESH_FLEET_ACCOUNTS_DB_PATH: /tmp/computemesh-fleet-pr139.db
      COMPUTEMESH_MODEL_STORAGE_DIR: /tmp/computemesh-models-pr139
    steps:
      - name: Checkout exact source, do not persist credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Verify SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Install declared Python test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements.txt -r requirements-dev.txt pytest
      - name: Compile mobile backend and regression tests
        run: |
          python3 -m py_compile services/portal/fleet_accounts.py services/portal/mobile_device_auth.py services/portal/passkey_routes.py services/portal/server_core.py services/gateway/server.py services/portal/tests/test_mobile_device_enrollment.py services/portal/tests/test_fleet_http.py
      - name: Run QR and device-bound mobile server regression
        run: python3 -m pytest -q services/portal/tests/test_mobile_device_enrollment.py services/portal/tests/test_fleet_http.py
  mobile-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact source, do not persist credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          submodules: false
      - name: Verify SHA
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - name: Check available Android toolchain
        run: |
          java -version
          test -x apps/android/gradlew || chmod +x apps/android/gradlew
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: Android unit tests, lint and unsigned debug build
        working-directory: apps/android
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
