name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPUTEMESH_INFERENCE_BACKEND: synthetic
      COMPUTEMESH_ALLOW_SYNTHETIC_INFERENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q apps deploy models protocol runtime sdk services setup tests tools

      - name: Gateway backend tests
        run: |
          python -m unittest services.gateway.tests.test_inference_backend -v
          python -m unittest services.gateway.tests.test_execution_attestation -v
          python -m unittest services.gateway.tests.test_live_bootstrap -v
          python -m unittest services.gateway.tests.test_cancellable_inference -v

      - name: Job-bound runtime attestation tests
        run: |
          python -m unittest runtime.llama.tests.test_job_attestation -v
          python -m unittest runtime.llama.tests.test_job_bound_shared_trial -v
          python -m unittest runtime.llama.tests.test_shared_request -v
          python -m unittest runtime.llama.tests.test_shared_request_live_health -v

      - name: Live control-plane and recovery tests
        run: |
          python -m unittest services.orchestrator.tests.test_attestation_collection -v
          python -m unittest services.orchestrator.tests.test_authenticated_attestation_transport -v
          python -m unittest services.orchestrator.tests.test_shared_request_backend -v
          python -m unittest services.orchestrator.tests.test_shared_request_cancellation -v
          python -m unittest services.orchestrator.tests.test_live_shared_runtime -v
          python -m unittest services.orchestrator.tests.test_live_model_catalog -v
          python -m unittest services.orchestrator.tests.test_live_shared_recovery -v
          python -m unittest services.orchestrator.tests.test_live_request_cancel_registry -v
          python -m unittest services.orchestrator.tests.test_persistent_control_channel -v
          python -m unittest services.orchestrator.tests.test_live_provider_registration -v
          python -m unittest services.orchestrator.tests.test_startup_recovery -v
          python -m unittest services.orchestrator.tests.test_settlement_recovery -v
          python -m unittest services.orchestrator.tests.test_threaded_live_sqlite -v

      - name: Full test suite
        run: python run_all_tests.py
