name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COMPUTEMESH_INFERENCE_BACKEND: synthetic
      COMPUTEMESH_ALLOW_SYNTHETIC_INFERENCE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Compile Python
        run: python -m compileall -q apps deploy models protocol runtime sdk services setup tests tools

      - name: Gateway backend tests
        run: |
          python -m unittest services.gateway.tests.test_inference_backend -v
          python -m unittest services.gateway.tests.test_execution_attestation -v

      - name: Full test suite
        run: python run_all_tests.py
