					input.multiple = true;
					input.accept = 'image/*,application/pdf,text/*,.json,.csv,.md,.py,.kt,.js,.ts,.html,.css,.log,.yaml,.yml';
					input.style.display = 'none';
					input.addEventListener('change', function(e) {
						if (e.target.files && e.target.files.length > 0) {
							dispatchFilesToSvelteKit(e.target.files);
							input.value = '';
						}
					});
					document.body.appendChild(input);
					hiddenFileInput = input;
				}

				function dispatchFilesToSvelteKit(fileList) {
					const nativeInputs = document.querySelectorAll('input[type="file"]:not(#cm-native-file-input)');
					if (nativeInputs.length > 0) {
						try {
							const dt = new DataTransfer();
							for (let i = 0; i < fileList.length; i++) {
								dt.items.add(fileList[i]);
							}
							const targetInput = nativeInputs[0];
							targetInput.files = dt.files;
							targetInput.dispatchEvent(new Event('change', { bubbles: true }));
							return;
						} catch (err) {
							console.warn('DataTransfer dispatch failed:', err);
						}
					}
				}

				function openFilePicker() {
					const nativeInputs = document.querySelectorAll('input[type="file"]:not(#cm-native-file-input)');
					if (nativeInputs.length > 0) {
						nativeInputs[0].click();
					} else if (hiddenFileInput) {
						hiddenFileInput.click();
					}
				}

				function injectAttachmentButton() {
					if (document.getElementById('cm-attachment-btn')) return;
					setupHiddenFileInput();

					// Look for the bottom toolbar row inside the input card
					const toolbar = document.querySelector('form div[style*="container-type"], form .flex.items-center.gap-1\\.5, form div.flex.items-center, form [data-slot="input-area"] .flex-column');
					const modelSelectorBtn = document.querySelector('form button:has(.lucide-box), form button:has(svg), form [data-slot="input-area"] button');
					const form = document.querySelector('form');

					if (!toolbar && !modelSelectorBtn && !form) return;

					const btn = document.createElement('button');
					btn.id = 'cm-attachment-btn';
					btn.type = 'button';
					btn.title = 'Datei, Bild oder Dokument hochladen';
					btn.innerHTML = `
						<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
							<line x1="12" y1="5" x2="12" y2="19"></line>
							<line x1="5" y1="12" x2="19" y2="12"></line>
						</svg>
					`;

					btn.addEventListener('click', function(e) {
						e.preventDefault();
						e.stopPropagation();
						openFilePicker();
					});

					if (modelSelectorBtn && modelSelectorBtn.parentNode) {
						modelSelectorBtn.parentNode.insertBefore(btn, modelSelectorBtn);
					} else if (toolbar) {
						toolbar.insertBefore(btn, toolbar.firstChild);
					} else if (form) {
						const card = form.querySelector('[data-slot="input-area"] > div, .flex-column') || form;
						card.appendChild(btn);
					}
				}

				setupHiddenFileInput();
				injectAttachmentButton();

				const attachObserver = new MutationObserver(function() {
					injectAttachmentButton();
				});
				if (document.body) {
					attachObserver.observe(document.body, { childList: true, subtree: true });
				} else {
					document.addEventListener('DOMContentLoaded', function() {
						attachObserver.observe(document.body, { childList: true, subtree: true });
					});
				}
				setInterval(injectAttachmentButton, 350);
			})();
		</script>
	</body>
</html>
