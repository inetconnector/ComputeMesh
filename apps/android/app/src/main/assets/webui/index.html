		<script>
			// Pre-set MCP setup flags so onboarding modal is disabled by default on clean launch
			try {
				localStorage.setItem("LlamaUi.mcpServersSetupDone", "true");
				localStorage.setItem("LlamaCppWebui.mcpServersSetupDone", "true");
				localStorage.setItem("ComputeMesh.mcpServersSetupDone", "true");
				localStorage.setItem("mcp_modal_dismissed", "true");
				localStorage.setItem("mcp_setup_done", "true");
				localStorage.setItem("has_seen_mcp_modal", "true");

				// Auto-authenticate with ComputeMesh credentials
				var urlParams = new URLSearchParams(window.location.search);
				var keyFromUrl = urlParams.get("key") || urlParams.get("api_key") || urlParams.get("token");
				var rawKey = keyFromUrl || localStorage.getItem("cm_fleet_owner_key") || localStorage.getItem("cm_owner_key") || localStorage.getItem("cm_api_key") || localStorage.getItem("cm_token") || localStorage.getItem("apiKey");

				if (rawKey) {
					var cmKey = String(rawKey).trim().replace(/^["'`]|["'`]$/g, '').replace(/^Bearer\s+/i, '').split(/[\r\n]/)[0].trim();
					if (cmKey) {
						localStorage.setItem("apiKey", cmKey);
						localStorage.setItem("cm_fleet_owner_key", cmKey);
						localStorage.setItem("cm_owner_key", cmKey);
						localStorage.setItem("cm_api_key", cmKey);
						localStorage.setItem("cm_token", cmKey);

						var configKeys = ["LlamaUi.config", "LlamaCppWebui.config", "LlamacppWebui.config", "settings", "config"];
						configKeys.forEach(function(k) {
							try {
								var cfgRaw = localStorage.getItem(k) || "{}";
								var cfg = JSON.parse(cfgRaw);
								cfg.apiKey = cmKey;
								localStorage.setItem(k, JSON.stringify(cfg));
							} catch(e) {}
						});
						try {
							var ovRaw = localStorage.getItem("LlamaUi.userOverrides") || "[]";
							var ov = JSON.parse(ovRaw);
							if (!Array.isArray(ov)) ov = [];
							if (!ov.includes("apiKey")) ov.push("apiKey");
							localStorage.setItem("LlamaUi.userOverrides", JSON.stringify(ov));
						} catch(e) {}

						try {
							var isSecure = window.location.protocol === 'https:';
							var cookieStr = 'cm_session=' + encodeURIComponent(cmKey) + '; Path=/; Max-Age=31536000; SameSite=Lax';
							if (window.location.hostname.endsWith('inetconnector.com')) cookieStr += '; Domain=.inetconnector.com';
							if (isSecure) cookieStr += '; Secure';
							document.cookie = cookieStr;
						} catch(e) {}
					}
				}
			} catch (e) {}
		</script>

								<div class="cm-voice-orb-glow" id="cm-voice-orb-glow"></div>
								<div class="cm-voice-orb" id="cm-voice-orb" title="Tippen zum Senden"></div>
							</div>
						</div>

						<div class="cm-voice-bottom-stage">
							<div class="cm-voice-transcript-box">
								<div class="cm-voice-transcript-placeholder" id="cm-voice-transcript-placeholder">Ich höre dir zu... Sprich einfach frei.</div>
								<div class="cm-voice-transcript-text" id="cm-voice-transcript-text" style="display: none;"></div>
							</div>

							<div class="cm-voice-actions">
								<button class="cm-voice-action-btn cancel" id="cm-voice-btn-cancel">
									✕ Abbrechen
								</button>
								<button class="cm-voice-action-btn submit" id="cm-voice-btn-submit">
									✓ Fertig & Senden
								</button>
							</div>
						</div>
					`;
					document.body.appendChild(voiceOverlay);

					voiceOrb = document.getElementById('cm-voice-orb');
					voiceOrbGlow = document.getElementById('cm-voice-orb-glow');
					voiceTranscriptText = document.getElementById('cm-voice-transcript-text');
					voiceTranscriptPlaceholder = document.getElementById('cm-voice-transcript-placeholder');
					voiceBadgeStatus = document.getElementById('cm-voice-badge-text');

					document.getElementById('cm-voice-btn-close').addEventListener('click', closeVoiceMode);
					document.getElementById('cm-voice-btn-cancel').addEventListener('click', closeVoiceMode);
					document.getElementById('cm-voice-btn-submit').addEventListener('click', submitVoiceMode);
					voiceOrb.addEventListener('click', function() {
						if (currentTranscript.trim()) {
							submitVoiceMode();
						}
					});
				}

				function setOrbAmplitude(amp) {
					if (!voiceOrb || !voiceOrbGlow) return;
					const scale = 1.0 + Math.min(amp * 0.45, 0.55);
					const glowScale = 1.0 + Math.min(amp * 0.8, 0.9);
					const glowOpacity = 0.5 + Math.min(amp * 0.5, 0.5);
					
					voiceOrb.style.transform = `scale(${scale.toFixed(3)})`;
					voiceOrbGlow.style.transform = `scale(${glowScale.toFixed(3)})`;
					voiceOrbGlow.style.opacity = glowOpacity.toFixed(2);
				}

				function startWebAudioVisualizer() {
					try {
						if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
						navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
							webAudioStream = stream;
							const AudioContextClass = window.AudioContext || window.webkitAudioContext;
							if (!AudioContextClass) return;
							webAudioContext = new AudioContextClass();
							const source = webAudioContext.createMediaStreamSource(stream);
							webAudioAnalyser = webAudioContext.createAnalyser();
							webAudioAnalyser.fftSize = 256;
							source.connect(webAudioAnalyser);

							const dataArray = new Uint8Array(webAudioAnalyser.frequencyBinCount);
							function updateVis() {
								if (!isListening) return;
								webAudioAnalyser.getByteFrequencyData(dataArray);
								let sum = 0;
								for (let i = 0; i < dataArray.length; i++) {
									sum += dataArray[i];
								}
								const avg = sum / dataArray.length;
								const normalized = avg / 128.0;
								setOrbAmplitude(normalized);
								animFrameId = requestAnimationFrame(updateVis);
							}
							updateVis();
						}).catch(e => {
							console.log('Web Audio permission/capture skipped:', e);
						});
					} catch (e) {
						console.log('Web Audio not initialized:', e);
					}
				}

				function stopWebAudioVisualizer() {
					if (animFrameId) {
						cancelAnimationFrame(animFrameId);
						animFrameId = null;
					}
					if (webAudioStream) {
						webAudioStream.getTracks().forEach(t => t.stop());
						webAudioStream = null;
					}
					if (webAudioContext) {
						try { webAudioContext.close(); } catch(e) {}
						webAudioContext = null;
					}
					setOrbAmplitude(0);
				}

				window.__openVoiceMode = function() {
					createVoiceOverlayIfNeeded();
					currentTranscript = '';
					isListening = true;

					if (voiceTranscriptPlaceholder && voiceTranscriptText) {
						voiceTranscriptPlaceholder.style.display = 'block';
						voiceTranscriptText.style.display = 'none';
						voiceTranscriptText.innerText = '';
					}
					if (voiceBadgeStatus) {
						voiceBadgeStatus.innerText = 'Ich höre zu...';
					}

					voiceOverlay.classList.add('is-active');

					// 1. Android Native Speech Recognizer (if running in mobile app)
					const bridge = window.AndroidSpeechBridge || window.AndroidBridge;
					if (bridge && typeof bridge.startSpeechRecognition === 'function') {
						bridge.startSpeechRecognition('de-DE');
					} else {
						// 2. Standard Web Speech Recognition Fallback
						const SpeechRecClass = window.SpeechRecognition || window.webkitSpeechRecognition;
						if (SpeechRecClass) {
							try {
								webSpeechInstance = new SpeechRecClass();
								webSpeechInstance.continuous = true;
								webSpeechInstance.interimResults = true;
								webSpeechInstance.lang = 'de-DE';
								webSpeechInstance.onresult = function(ev) {
									let interim = '';
									let final = '';
									for (let i = ev.resultIndex; i < ev.results.length; ++i) {
										if (ev.results[i].isFinal) {
											final += ev.results[i][0].transcript;
										} else {
											interim += ev.results[i][0].transcript;
										}
									}
									const text = (final || interim).trim();
									if (text) {
										handleTranscriptUpdate(text, !!final);
									}
								};
								webSpeechInstance.onerror = function(ev) {
									console.log('WebSpeech error:', ev);
								};
								webSpeechInstance.start();
							} catch(e) {
								console.log('WebSpeech start error:', e);
							}
						}
						startWebAudioVisualizer();
					}
				};

				function handleTranscriptUpdate(text, isFinal) {
					currentTranscript = text;
					if (voiceTranscriptPlaceholder && voiceTranscriptText) {
						voiceTranscriptPlaceholder.style.display = 'none';
						voiceTranscriptText.style.display = 'block';
						voiceTranscriptText.innerText = text;
					}
				}

				function closeVoiceMode() {
					isListening = false;
					if (voiceOverlay) {
						voiceOverlay.classList.remove('is-active');
					}

					const bridge = window.AndroidSpeechBridge || window.AndroidBridge;
					if (bridge && typeof bridge.stopSpeechRecognition === 'function') {
						bridge.stopSpeechRecognition();
					}
					if (webSpeechInstance) {
						try { webSpeechInstance.stop(); } catch(e) {}
						webSpeechInstance = null;
					}
					stopWebAudioVisualizer();
				}
				window.__closeVoiceMode = closeVoiceMode;

				function submitVoiceMode() {
					const textToSend = currentTranscript.trim();
					closeVoiceMode();
					if (textToSend) {
						window.__sendComputeMeshPrompt(textToSend);
					}
				}

				// Android Native Speech Event Receiver
				window.__onAndroidSpeechEvent = function(event, data) {
					if (!isListening && event !== 'onresult') return;

					if (event === 'onstart') {
						if (voiceBadgeStatus) voiceBadgeStatus.innerText = 'Ich höre zu...';
					} else if (event === 'onrms') {
						const rms = parseFloat(data) || 0;
						const normalized = Math.max(0, Math.min(1.0, (rms + 2) / 10.0));
						setOrbAmplitude(normalized);
					} else if (event === 'onpartialresult') {
						handleTranscriptUpdate(data, false);
						setOrbAmplitude(0.4);
					} else if (event === 'onresult') {
						handleTranscriptUpdate(data, true);
						setOrbAmplitude(0.6);
						setTimeout(function() {
							if (isListening) {
								submitVoiceMode();
							}
						}, 700);
					} else if (event === 'onerror') {
						if (voiceBadgeStatus) voiceBadgeStatus.innerText = 'Ich höre zu...';
					} else if (event === 'onend') {
						if (voiceBadgeStatus) voiceBadgeStatus.innerText = 'Ich höre zu...';
					}
				};

				// Native Voice Button Direct Trigger
				function isVoiceButton(el) {
					if (!el) return false;
					if (el.closest('.cm-voice-overlay')) return false;
					if (el.closest('[role="menu"], [data-slot*="menu"], [data-slot*="dropdown"], [data-bits-menu-content], [data-radix-popper-content-wrapper], aside, [data-slot="dialog-content"], [role="dialog"]')) return false;

					const btn = el.closest('button, [role="button"], a, .cursor-pointer');
					if (!btn) return false;
					if (btn.getAttribute('type') === 'submit') return false;

					const title = (btn.getAttribute('title') || '').toLowerCase();
					const aria = (btn.getAttribute('aria-label') || '').toLowerCase();
					const text = (btn.innerText || '').trim().toLowerCase();
					const html = btn.innerHTML || '';

					if (btn.querySelector('.lucide-mic, .lucide-mic-off, [data-lucide="mic"]') || html.includes('lucide-mic') || html.includes('lucide-mic-off')) return true;
					if (title.includes('aufnahme') || title.includes('sprachnachricht') || aria.includes('aufnahme') || aria.includes('sprachaufnahme')) return true;
					if ((text === 'mic' || text === 'sprache' || text === 'aufnahme') && !btn.closest('[role="menuitem"]')) return true;

					return false;
				}

				document.addEventListener('click', function(e) {
					if (isVoiceButton(e.target)) {
						e.preventDefault();
						e.stopPropagation();
						window.__openVoiceMode();
						return;
					}
				});

				document.addEventListener('touchend', function(e) {
					if (isVoiceButton(e.target)) {
						e.preventDefault();
						e.stopPropagation();
						window.__openVoiceMode();
					}
				}, { passive: false });

				// Reliable Global Prompt Dispatcher
				window.__sendComputeMeshPrompt = function(promptText) {
					const textarea = document.querySelector('textarea');
					const form = document.querySelector('form');
					if (!textarea || !form) return false;

					textarea.focus();
					textarea.value = promptText;
					textarea.dispatchEvent(new Event('input', { bubbles: true }));
					textarea.dispatchEvent(new Event('change', { bubbles: true }));

					setTimeout(function() {
						const submitBtn = form.querySelector('button[type="submit"]') || form.querySelector('button:last-of-type');
						if (submitBtn) {
							submitBtn.click();
						} else {
							form.requestSubmit();
						}
					}, 150);
					return true;
				};

				// Sidebar / Chat History Drawer Controls
				window.__toggleSidebar = function() {
					const aside = document.querySelector('aside');
					if (!aside) return false;
					const isExpanded = aside.classList.contains('is-expanded');
					if (isExpanded) {
						window.__closeSidebar();
					} else {
						window.__openSidebar();
					}
					return true;
				};

				window.__openSidebar = function() {
					const aside = document.querySelector('aside');
					if (!aside) return false;
					aside.classList.add('is-expanded');
					let backdrop = document.getElementById('cm-sidebar-backdrop');
					if (!backdrop) {
						backdrop = document.createElement('div');
						backdrop.id = 'cm-sidebar-backdrop';
						backdrop.className = 'cm-sidebar-backdrop';
						backdrop.onclick = function() {
							window.__closeSidebar();
						};
						document.body.appendChild(backdrop);
					}
					backdrop.classList.add('is-active');
					backdrop.style.setProperty('display', 'block', 'important');
					backdrop.style.setProperty('pointer-events', 'auto', 'important');
					
					const expandBtn = aside.querySelector('button[aria-label="Navigation erweitern"]');
					if (expandBtn) {
						try { expandBtn.click(); } catch(e) {}
					}
					return true;
				};

				window.__closeSidebar = function() {
					const aside = document.querySelector('aside');
					if (aside) {
						aside.classList.remove('is-expanded');
						const collapseBtn = aside.querySelector('button[aria-label="Navigation einklappen"]');
						if (collapseBtn) {
							try { collapseBtn.click(); } catch(e) {}
						}
					}
					const backdrop = document.getElementById('cm-sidebar-backdrop');
					if (backdrop) {
						backdrop.classList.remove('is-active');
						backdrop.style.setProperty('display', 'none', 'important');
						backdrop.style.setProperty('pointer-events', 'none', 'important');
					}
					return true;
				};

				// Auto-close sidebar when a conversation item is selected
				document.addEventListener('click', function(e) {
					const aside = document.querySelector('aside');
					if (aside && aside.classList.contains('is-expanded') && aside.contains(e.target)) {
						const isCollapse = e.target.closest('button[aria-label="Navigation einklappen"]');
						if (isCollapse) {
							window.__closeSidebar();
							return;
						}
						// Never close sidebar when clicking dropdown triggers, context menus (3 dots), or dialog triggers
						if (e.target.closest('button[aria-haspopup], [data-slot*="dropdown"], [data-slot*="menu"], [data-bits-dropdown-menu-trigger], button:has(svg.lucide-ellipsis), button:has(svg.lucide-more-vertical), button:has(svg.lucide-more-horizontal)')) {
							return;
						}
						const isConvLink = e.target.closest('a[href*="#/chat/"], a[href^="#/"]');
						if (isConvLink && !isConvLink.closest('button')) {
							setTimeout(function() {
								window.__closeSidebar();
							}, 120);
						}
					}
				});

				// Global New Chat Trigger
				window.__startNewChat = function() {
					try {
						window.__closeSidebar();
						const textarea = document.querySelector('textarea');
						if (textarea) {
							textarea.value = '';
							textarea.dispatchEvent(new Event('input', { bubbles: true }));
						}
						const links = Array.from(document.querySelectorAll('a, button'));
						const newChatBtn = links.find(function(el) {
							const href = el.getAttribute('href') || '';
							const text = (el.innerText || '').toLowerCase();
							const html = el.innerHTML || '';
							return href.includes('new_chat') || href === '#/' || href.endsWith('/#/') ||
							       text.includes('neuer chat') || html.includes('lucide-square-pen');
						});
						if (newChatBtn) {
							newChatBtn.click();
						} else {
							window.location.hash = '#/';
						}
						return true;
					} catch(e) {
						console.error('Failed to start new chat:', e);
						window.location.hash = '#/';
						return false;
					}
				};

				// Click on any chat image to open full-size Lightbox preview
				document.addEventListener('click', function(e) {
					var target = e.target;
					if (target && target.tagName === 'IMG' && !target.closest('.cm-image-lightbox') && !target.classList.contains('no-lightbox') && !target.closest('button')) {
						var lightbox = document.getElementById('cm-lightbox');
						if (!lightbox) {
							lightbox = document.createElement('div');
							lightbox.id = 'cm-lightbox';
							lightbox.className = 'cm-image-lightbox';
							lightbox.innerHTML = '<button class="cm-lightbox-close" aria-label="Schließen">&times;</button><img id="cm-lightbox-img" src="" alt="Vollbild" />';
							lightbox.addEventListener('click', function() {
								lightbox.classList.remove('active');
							});
							document.body.appendChild(lightbox);
						}
						var lbImg = document.getElementById('cm-lightbox-img');
						if (lbImg && target.src) {
							lbImg.src = target.src;
							lightbox.classList.add('active');
						}
					}
				});

				// The gateway's active slot is the source of truth for modality actions.
				// Fail closed: do not offer photo/audio/video actions when support is
				// unknown, instead of letting a user capture a file that will be rejected.
				async function cmUpdateModalityActions() {
					try {
						var selector = window.ComputeMeshModelSelector;
						var selected = selector && selector.getSelectedModel();
						if (!selected) {
							var response = await fetch('/slots', { credentials: 'same-origin', cache: 'no-store' });
							if (!response.ok) throw new Error('Unable to read active model');
							var slots = await response.json();
							selected = { id: Array.isArray(slots) && slots.length ? slots[0].model : '' };
						}
						var modalities = selector ? selector.modalitiesFor(selected) : ['text'];
						document.documentElement.classList.toggle('cm-model-no-vision', !modalities.includes('vision'));
						document.documentElement.classList.toggle('cm-model-no-audio', !modalities.includes('audio'));
						document.documentElement.classList.toggle('cm-model-no-video', !modalities.includes('video'));
					} catch (err) {
						document.documentElement.classList.add('cm-model-no-vision', 'cm-model-no-audio', 'cm-model-no-video');
					}
				}
				cmUpdateModalityActions();
				window.addEventListener('cm:model-selection-change', cmUpdateModalityActions);
				setInterval(cmUpdateModalityActions, 5000);
			})();
		</script>
	</body>
</html>
