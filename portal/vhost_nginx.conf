# ComputeMesh High-Security & Anti-Eavesdropping Configuration (TLS 1.3 / GDPR Hardened)
proxy_hide_header X-Powered-By;
proxy_hide_header Server;

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;

location /v1/ {
    proxy_pass http://127.0.0.1:8000/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    # Ensure raw prompt payload is not buffered to disk
    proxy_max_temp_file_size 0;
}

location /api/ {
    proxy_pass http://127.0.0.1:8000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_max_temp_file_size 0;
}

location /node/ {
    proxy_pass http://127.0.0.1:8000/node/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;
    proxy_max_temp_file_size 0;
}
